site_name: Geotechnical Instrumentation Knowledge Base
site_description: >-
  Geotechnical instrumentation knowledge base — field monitoring guides,
  instrument principles, and reference manuals for engineers.
site_url: https://rstaffinity.github.io/geoinst/
repo_url: https://github.com/rstaffinity/geoinst
repo_name: rstaffinity/geoinst
edit_uri: ""

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/screw-machine-flat-top

extra:
  generator: false

extra_css:
  - assets/lang-switch.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - tags

nav:
  - Home: index.md
  - "Tiếng Việt (VI)":
      - Trang chủ: vi/index.md
      - Tuân thủ pháp lý:
          - Tổng quan: vi/tuan-thu/index.md
          - Ma trận Nghị định 114 & TCVN 9398: vi/tuan-thu/nghi-dinh-114-tcvn-9398.md
      - Hệ thống ADAQS: vi/adaqs/index.md
      - Thuật ngữ Anh – Việt: vi/thuat-ngu/index.md
  - "Compliance (EN)":
      - Decree 114 / TCVN 9398 Matrix: compliance/decree-114-tcvn-9398.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Instrument Categories: getting-started/categories.md
      - How to Use This Site: getting-started/how-to-use.md
  - Field Notes:
      - Digital Tiltmeter Connection Issue: field-notes/digital-tilmeter-connection-issue.md
      - TDR Configuration Document (ES): field-notes/documento-de-configuraci-n-de-tdr.md
      - How Pneumatic Piezometers Work: field-notes/how-do-pneumatic-piezometer-works.md
      - How to Find SAAV Resources: field-notes/how-to-find-saav-resources.md
      - Programming the D'Aerator Timer: field-notes/how-to-program-the-timer-on-a-d-aerator.md
      - Purging Air from a D'Aerator: field-notes/how-to-purge-air-out-of-a-d-39-aerator.md
      - Resetting the Instantel Micromate: field-notes/how-to-reset-instantel-micromate.md
      - TDR Sensor & TDR200 Setup: field-notes/how-to-setup-a-tdr-sensor-and-tdr200-datalogger.md
      - Inclinalysis — Changing X-Axis Values: field-notes/inclinalysis-changing-values-on-the-x-axis.md
      - Neat Grout vs. Bentonite Grout: field-notes/neat-grout-vs-bentonite-grout.md
      - Pneumatic Piezometer — Working Principle: field-notes/pneumatic-piezometer-working-principle.md
      - TDR200 with PC-TDR Software: field-notes/tdr200-setting-up-a-tdr-using-pc-tdr-software.md
      - TDR200 Setup Document: field-notes/tdr200-setup-document.md
      - VW Piezometer kPa/MPa Calculation: field-notes/vw-piezometer-kpa-mpa-calculation-spreadsheet.md
  - Applications:
      - Index: applications/index.md
      - Slope Stability: applications/slope-stability.md
      - Dam Monitoring: applications/dam-monitoring.md
      - Tunnel Instrumentation: applications/tunnels.md
      - Foundation & Excavation: applications/foundations.md
  - Manufacturers:
      - Index: manufacturers/index.md
      - Durham Geo Slope Indicator: manufacturers/dgsi.md
      - GEO-Instruments: manufacturers/geo-instruments.md
      - Geocomp: manufacturers/geocomp.md
  - Reference Manuals:
      - Catalog Index: reference-manuals/index.md
      - Dunnicliff (Field Monitoring): reference-manuals/dunnicliff.md
      - FHWA Reference Manual: reference-manuals/fhwa.md
      - Das (Foundation Engineering): reference-manuals/das-foundation.md
      - Das (Geotechnical Engineering): reference-manuals/das-geotech.md
  - Interactive Sandbox: visualizer.md
  - GTI Doctor (AI): gti-doctor.md
