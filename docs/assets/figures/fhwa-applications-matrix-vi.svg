<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Chọn thiết bị theo loại công trình</text>

  <!-- header row -->
  <rect x="270" y="60" width="480" height="46" fill="#eef2f7"/>
  <g font-size="10.5" fill="#1a4b7a" text-anchor="middle" font-weight="700">
    <text x="318" y="80">Áp</text><text x="318" y="94">kế</text>
    <text x="414" y="80">Đo nghiêng /</text><text x="414" y="94">Biến dạng sâu</text>
    <text x="510" y="80">Tải /</text><text x="510" y="94">Biến dạng</text>
    <text x="606" y="80">Áp lực</text><text x="606" y="94">đất</text>
    <text x="702" y="80">Đo đạc /</text><text x="702" y="94">chuyển vị</text>
  </g>

  <!-- rows -->
  <g font-size="12" fill="#222">
    <rect x="30" y="106" width="720" height="46" fill="#fafafa"/>
    <text x="44" y="134" font-weight="600">Mái dốc đất &amp; nền đắp</text>
    <rect x="30" y="152" width="720" height="46" fill="#ffffff"/>
    <text x="44" y="180" font-weight="600">Móng sâu</text>
    <rect x="30" y="198" width="720" height="46" fill="#fafafa"/>
    <text x="44" y="226" font-weight="600">Kết cấu chắn đất</text>
    <rect x="30" y="244" width="720" height="46" fill="#ffffff"/>
    <text x="44" y="272" font-weight="600">Gia cố nền</text>
    <rect x="30" y="290" width="720" height="46" fill="#fafafa"/>
    <text x="44" y="318" font-weight="600">Mái dốc đá</text>
  </g>

  <!-- grid lines -->
  <g stroke="#d7dee6" stroke-width="1">
    <line x1="270" y1="106" x2="270" y2="336"/>
    <line x1="366" y1="106" x2="366" y2="336"/>
    <line x1="462" y1="106" x2="462" y2="336"/>
    <line x1="558" y1="106" x2="558" y2="336"/>
    <line x1="654" y1="106" x2="654" y2="336"/>
    <line x1="750" y1="106" x2="750" y2="336"/>
  </g>

  <!-- marks: filled = primary, hollow = secondary -->
  <g>
    <!-- soil slopes -->
    <circle cx="318" cy="129" r="7" fill="#2b6cb0"/>
    <circle cx="414" cy="129" r="7" fill="#2b6cb0"/>
    <circle cx="510" cy="129" r="7" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <circle cx="606" cy="129" r="7" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <circle cx="702" cy="129" r="7" fill="#2b6cb0"/>
    <!-- deep foundations -->
    <circle cx="318" cy="175" r="7" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <circle cx="414" cy="175" r="7" fill="#2b6cb0"/>
    <circle cx="510" cy="175" r="7" fill="#2b6cb0"/>
    <circle cx="606" cy="175" r="7" fill="#2b6cb0"/>
    <circle cx="702" cy="175" r="7" fill="#2b6cb0"/>
    <!-- retaining structures -->
    <circle cx="318" cy="221" r="7" fill="#2b6cb0"/>
    <circle cx="414" cy="221" r="7" fill="#2b6cb0"/>
    <circle cx="510" cy="221" r="7" fill="#2b6cb0"/>
    <circle cx="606" cy="221" r="7" fill="#2b6cb0"/>
    <circle cx="702" cy="221" r="7" fill="#2b6cb0"/>
    <!-- ground improvement -->
    <circle cx="318" cy="267" r="7" fill="#2b6cb0"/>
    <circle cx="414" cy="267" r="7" fill="#2b6cb0"/>
    <circle cx="510" cy="267" r="7" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <circle cx="606" cy="267" r="7" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <circle cx="702" cy="267" r="7" fill="#2b6cb0"/>
    <!-- rock slopes -->
    <circle cx="318" cy="313" r="7" fill="#2b6cb0"/>
    <circle cx="414" cy="313" r="7" fill="#2b6cb0"/>
    <circle cx="510" cy="313" r="7" fill="#2b6cb0"/>
    <circle cx="606" cy="313" r="7" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <circle cx="702" cy="313" r="7" fill="#2b6cb0"/>
  </g>

  <!-- legend -->
  <circle cx="300" cy="356" r="6" fill="#2b6cb0"/>
  <text x="312" y="360" font-size="11" fill="#444">thiết bị chính</text>
  <circle cx="452" cy="356" r="6" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="464" y="360" font-size="11" fill="#444">dùng phụ / chọn lọc</text>

  <text x="390" y="384" text-anchor="middle" font-size="11" fill="#999">Sơ đồ phỏng theo FHWA-HI-98-034, Ch. 7–11. Không theo tỷ lệ.</text>
</svg>
