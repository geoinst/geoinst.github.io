<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Consolidation: e&#8211;log &#963;&#8242; and time&#8211;settlement curves</text>

  <!-- ===== LEFT PANEL: e - log sigma' ===== -->
  <text x="215" y="56" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">Void ratio &#8211; effective stress</text>
  <g stroke="#ececec" stroke-width="1">
    <line x1="90" y1="90"  x2="350" y2="90"/>
    <line x1="90" y1="150" x2="350" y2="150"/>
    <line x1="90" y1="210" x2="350" y2="210"/>
    <line x1="90" y1="270" x2="350" y2="270"/>
    <line x1="90" y1="320" x2="350" y2="320"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="90" y1="80" x2="90" y2="320"/>
    <line x1="90" y1="320" x2="350" y2="320"/>
  </g>
  <!-- curve: gentle Cr then steeper Cc -->
  <path d="M 105,132 L 225,158" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <path d="M 225,158 C 275,178 320,225 345,272" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <!-- preconsolidation pressure -->
  <line x1="225" y1="158" x2="225" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="225" cy="158" r="3.8" fill="#2b6cb0"/>
  <text x="228" y="314" font-size="11" fill="#666">&#963;&#8242;<tspan baseline-shift="sub" font-size="8">p</tspan></text>
  <!-- slope labels -->
  <text x="150" y="134" font-size="11.5" fill="#2b6cb0">C<tspan baseline-shift="sub" font-size="8">r</tspan></text>
  <text x="300" y="232" font-size="11.5" fill="#2b6cb0">C<tspan baseline-shift="sub" font-size="8">c</tspan></text>
  <!-- axis titles -->
  <text x="60" y="205" font-size="11.5" fill="#333" text-anchor="middle" transform="rotate(-90 60 205)">Void ratio, e</text>
  <text x="220" y="344" font-size="11.5" fill="#333" text-anchor="middle">log &#963;&#8242;</text>

  <!-- divider -->
  <line x1="390" y1="60" x2="390" y2="360" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ===== RIGHT PANEL: time - settlement ===== -->
  <text x="565" y="56" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">Time &#8211; settlement</text>
  <g stroke="#ececec" stroke-width="1">
    <line x1="440" y1="90"  x2="700" y2="90"/>
    <line x1="440" y1="150" x2="700" y2="150"/>
    <line x1="440" y1="210" x2="700" y2="210"/>
    <line x1="440" y1="270" x2="700" y2="270"/>
    <line x1="440" y1="320" x2="700" y2="320"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="440" y1="80" x2="440" y2="320"/>
    <line x1="440" y1="320" x2="700" y2="320"/>
  </g>
  <!-- S-shaped settlement curve -->
  <path d="M 455,92 C 520,100 545,175 570,232 C 588,268 615,285 690,292" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- asymptote -->
  <line x1="440" y1="292" x2="700" y2="292" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="628" y="286" font-size="10.5" fill="#666">Final settlement</text>
  <!-- 50% point -->
  <circle cx="556" cy="205" r="3.8" fill="#c0392b"/>
  <text x="500" y="200" font-size="10.5" fill="#c0392b">t&#8325;&#8320; (U = 50%)</text>
  <!-- axis titles -->
  <text x="410" y="205" font-size="11.5" fill="#333" text-anchor="middle" transform="rotate(-90 410 205)">Settlement, &#961;</text>
  <text x="570" y="344" font-size="11.5" fill="#333" text-anchor="middle">log time</text>

  <text x="390" y="404" text-anchor="middle" font-size="11" fill="#999">Schematic after USACE EM 1110-1-1904. Not to scale.</text>
</svg>
