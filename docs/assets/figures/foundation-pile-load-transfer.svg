<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Load transfer in an axially loaded pile</text>

  <!-- ground -->
  <rect x="40" y="90" width="360" height="290" fill="#efe6cf"/>
  <line x1="40" y1="90" x2="400" y2="90" stroke="#8a7f5f" stroke-width="2"/>
  <text x="70" y="112" font-size="11" fill="#6b5d33">Ground surface</text>

  <!-- pile -->
  <rect x="205" y="70" width="40" height="300" fill="#dfe4ea" stroke="#9aa4b0" stroke-width="1.5"/>
  <!-- applied load -->
  <line x1="225" y1="30" x2="225" y2="62" stroke="#333" stroke-width="3"/>
  <polygon points="225,66 218,54 232,54" fill="#333"/>
  <text x="270" y="46" font-size="11" fill="#333">Applied load P</text>

  <!-- skin friction arrows -->
  <g stroke="#2f855a" stroke-width="2" fill="#2f855a">
    <line x1="185" y1="140" x2="203" y2="140"/><polygon points="203,140 195,136 195,144"/>
    <line x1="185" y1="200" x2="203" y2="200"/><polygon points="203,200 195,196 195,204"/>
    <line x1="185" y1="260" x2="203" y2="260"/><polygon points="203,260 195,256 195,264"/>
    <line x1="265" y1="140" x2="247" y2="140"/><polygon points="247,140 255,136 255,144"/>
    <line x1="265" y1="200" x2="247" y2="200"/><polygon points="247,200 255,196 255,204"/>
    <line x1="265" y1="260" x2="247" y2="260"/><polygon points="247,260 255,256 255,264"/>
  </g>
  <text x="120" y="205" font-size="11" fill="#1e5c3a">Skin friction</text>

  <!-- end bearing -->
  <g stroke="#c53030" stroke-width="2.5" fill="#c53030">
    <line x1="225" y1="370" x2="225" y2="398"/><polygon points="225,400 219,388 231,388"/>
  </g>
  <text x="255" y="392" font-size="11" fill="#9b2c2c">End bearing</text>

  <!-- load distribution curve -->
  <line x1="470" y1="90" x2="470" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="470" y1="90" x2="740" y2="90" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="80" text-anchor="middle" font-size="11" fill="#333">Axial load in pile</text>
  <polyline points="700,95 660,140 600,200 540,260 500,330 485,375" fill="none" stroke="#1565c0" stroke-width="3"/>
  <text x="720" y="112" font-size="10" fill="#1565c0">P</text>
  <text x="500" y="388" font-size="10" fill="#1565c0">load → 0 at toe</text>
  <text x="470" y="408" text-anchor="middle" font-size="10" fill="#666">Depth</text>

  <text x="390" y="416" text-anchor="middle" font-size="11" fill="#999">Schematic after USACE EM 1110-2-2906 / FHWA GEC-12. Not to scale.</text>
</svg>
