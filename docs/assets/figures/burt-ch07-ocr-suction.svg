<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Overconsolidation ratio and the soil suction pF scale</text>

  <!-- LEFT: e-log p curve -->
  <text x="210" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">e — log σ′v curve</text>

  <line x1="70" y1="330" x2="360" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="330" x2="70" y2="76" stroke="#334155" stroke-width="2"/>
  <text x="215" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">log σ′v</text>
  <text x="34" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155" transform="rotate(-90 34 205)">void ratio  e</text>

  <!-- recompression line (flat) -->
  <line x1="80" y1="120" x2="215" y2="146" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- virgin compression line (steep) -->
  <line x1="215" y1="146" x2="350" y2="300" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- sigma'p marker -->
  <line x1="215" y1="146" x2="215" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="215" y="348" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">σ′p</text>
  <text x="222" y="126" font-size="10.5" fill="#1d4ed8" font-weight="600">recompression (Cr)</text>
  <text x="252" y="228" font-size="10.5" fill="#1d4ed8" font-weight="600">virgin (Cc)</text>

  <!-- sigma'v0 marker -->
  <line x1="160" y1="130" x2="160" y2="330" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="150" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">σ′v0</text>

  <rect x="70" y="366" width="290" height="52" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="386" font-size="11.5" font-weight="700" fill="#334155">OCR = σ′p / σ′v0</text>
  <text x="82" y="404" font-size="10.5" fill="#475569">NC ≈ 1 · lightly OC 1–2 · OC 2–4 · heavily OC &gt; 4</text>

  <!-- RIGHT: pF scale -->
  <text x="575" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Soil suction — the pF scale</text>

  <!-- vertical scale bar -->
  <g>
    <rect x="420" y="80" width="60" height="60" fill="#dbeafe"/>
    <rect x="420" y="140" width="60" height="80" fill="#bfdbfe"/>
    <rect x="420" y="220" width="60" height="70" fill="#93c5fd"/>
    <rect x="420" y="290" width="60" height="60" fill="#60a5fa"/>
    <rect x="420" y="350" width="60" height="60" fill="#3b82f6"/>
  </g>
  <g font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <text x="450" y="114">0</text>
    <text x="450" y="184">2</text>
    <text x="450" y="259">3</text>
    <text x="450" y="324">4.2</text>
    <text x="450" y="384">6</text>
  </g>
  <text x="414" y="74" font-size="10.5" fill="#475569" text-anchor="end">pF</text>

  <g font-size="11" fill="#1e293b">
    <text x="496" y="106" font-weight="700">Saturated</text>
    <text x="496" y="122" font-size="10" fill="#475569">pF 0 — positive pore pressure</text>

    <text x="496" y="172" font-weight="700">Field capacity</text>
    <text x="496" y="188" font-size="10" fill="#475569">≈ pF 2 — water drains freely</text>

    <text x="496" y="248" font-weight="700">Wilting point</text>
    <text x="496" y="264" font-size="10" fill="#475569">≈ pF 4.2 — plants can no longer extract</text>

    <text x="496" y="318" font-weight="700">Oven dry</text>
    <text x="496" y="334" font-size="10" fill="#475569">pF &gt; 6</text>
  </g>

  <rect x="420" y="418" width="340" height="1" fill="none"/>
  <text x="420" y="430" font-size="10.5" fill="#b91c1c" font-weight="600">Suction governs the behaviour of unsaturated soil —</text>
  <text x="420" y="444" font-size="10.5" fill="#b91c1c" font-weight="600">common in Vietnam and the tropics.</text>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look (2007), Ch. 7 — OCR, preconsolidation stress and soil suction. Original diagram.</text>
</svg>
