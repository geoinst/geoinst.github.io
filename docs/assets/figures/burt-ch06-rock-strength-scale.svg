<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Ước lượng cường độ đá tại hiện trường — thang giảm dần</text>

  <!-- strength bar -->
  <text x="40" y="60" font-size="12" font-weight="700" fill="#334155">Cường độ kháng nén một trục, qu</text>

  <g>
    <rect x="40" y="72" width="700" height="34" fill="#fee2e2"/>
    <rect x="250" y="72" width="490" height="34" fill="#ffedd5"/>
    <rect x="390" y="72" width="350" height="34" fill="#fef9c3"/>
    <rect x="530" y="72" width="210" height="34" fill="#dcfce7"/>
    <rect x="640" y="72" width="100" height="34" fill="#d1fae5"/>
  </g>
  <g font-size="10.5" fill="#334155" font-weight="700" text-anchor="middle">
    <text x="145" y="93">&lt; 1 MPa</text>
    <text x="320" y="93">1 – 5 MPa</text>
    <text x="460" y="93">5 – 25 MPa</text>
    <text x="585" y="93">25 – 100 MPa</text>
    <text x="690" y="93">&gt; 100 MPa</text>
  </g>

  <!-- descriptors -->
  <g font-size="11.5" fill="#1e293b">
    <text x="40" y="130" font-weight="700">Rất yếu</text>
    <text x="40" y="148" font-size="10.5" fill="#475569">Vụn / lõm khi ấn</text>
    <text x="40" y="164" font-size="10.5" fill="#475569">bằng ngón tay cái</text>

    <text x="250" y="130" font-weight="700">Yếu</text>
    <text x="250" y="148" font-size="10.5" fill="#475569">Bóc được bằng dao;</text>
    <text x="250" y="164" font-size="10.5" fill="#475569">vỡ được bằng tay</text>

    <text x="390" y="130" font-weight="700">Trung bình</text>
    <text x="390" y="148" font-size="10.5" fill="#475569">Vỡ khi đập mạnh</text>
    <text x="390" y="164" font-size="10.5" fill="#475569">bằng búa địa chất</text>

    <text x="530" y="130" font-weight="700">Mạnh</text>
    <text x="530" y="148" font-size="10.5" fill="#475569">Phải đập nhiều lần;</text>
    <text x="530" y="164" font-size="10.5" fill="#475569">vỡ thành mảnh</text>

    <text x="640" y="130" font-weight="700">Rất mạnh</text>
    <text x="640" y="148" font-size="10.5" fill="#475569">Kêu khi va đập;</text>
    <text x="640" y="164" font-size="10.5" fill="#475569">làm sứt búa</text>
  </g>

  <!-- index tests -->
  <text x="40" y="206" font-size="12" font-weight="700" fill="#334155">Hai thí nghiệm chỉ số định lượng</text>

  <rect x="40" y="218" width="340" height="120" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="56" y="240" font-size="12" font-weight="700" fill="#1d4ed8">Chỉ số tải trọng điểm, Is(50)</text>
  <text x="56" y="264" font-size="11" fill="#334155">qu ≈ 20 – 24 × Is(50)</text>
  <line x1="56" y1="276" x2="364" y2="276" stroke="#c7d7f5"/>
  <text x="56" y="296" font-size="10.5" fill="#475569">Gọn nhẹ; dùng được trên lõi không đều</text>
  <text x="56" y="312" font-size="10.5" fill="#475569">và trên mặt cắt tại hiện trường.</text>
  <text x="56" y="330" font-size="10.5" fill="#b91c1c">Hiệu chỉnh kích thước về chuẩn 50 mm.</text>

  <rect x="400" y="218" width="340" height="120" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="416" y="240" font-size="12" font-weight="700" fill="#15803d">Búa nảy Schmidt</text>
  <text x="416" y="264" font-size="11" fill="#334155">Chỉ số nảy R → qu (thực nghiệm)</text>
  <line x1="416" y1="276" x2="724" y2="276" stroke="#bbf7d0"/>
  <text x="416" y="296" font-size="10.5" fill="#475569">Nhanh, không phá hủy, chỉ đo bề mặt.</text>
  <text x="416" y="312" font-size="10.5" fill="#475569">Hiệu chuẩn theo loại đá tại chỗ.</text>
  <text x="416" y="330" font-size="10.5" fill="#b91c1c">Đá yếu hoặc phong hóa cho giá trị thấp hơn thực.</text>

  <!-- note -->
  <rect x="40" y="352" width="700" height="52" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="56" y="374" font-size="11" fill="#9a3412">Cường độ hiện trường là cường độ của khối đá nguyên dạng. Khối đá còn yếu hơn nữa — khe nứt, phong hóa và tỷ lệ làm giảm tiếp (§9.8, §9.11).</text>
  <text x="56" y="392" font-size="11" fill="#9a3412">Mức từ chối của giàn khoan và tốc độ khoan cũng là chỉ dấu cường độ dùng được (§6.2–6.3).</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look (2007), Ch. 6 — cường độ đá từ phân loại và thử nghiệm. Sơ đồ gốc.</text>
</svg>
