<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Estimating rock strength in the field — the descending scale</text>

  <!-- strength bar -->
  <text x="40" y="60" font-size="12" font-weight="700" fill="#334155">Uniaxial compressive strength, qu</text>

  <g>
    <rect x="40" y="72" width="700" height="34" fill="#fee2e2"/>
    <rect x="250" y="72" width="490" height="34" fill="#ffedd5"/>
    <rect x="390" y="72" width="350" height="34" fill="#fef9c3"/>
    <rect x="530" y="72" width="210" height="34" fill="#dcfce7"/>
    <rect x="640" y="72" width="100" height="34" fill="#d1fae5"/>
  </g>
  <g font-size="10.5" fill="#334155" font-weight="700" text-anchor="middle">
    <text x="145" y="93">&lt; 1 MPa</text>
    <text x="320" y="93">1 – 5 MPa</text>
    <text x="460" y="93">5 – 25 MPa</text>
    <text x="585" y="93">25 – 100 MPa</text>
    <text x="690" y="93">&gt; 100 MPa</text>
  </g>

  <!-- descriptors -->
  <g font-size="11.5" fill="#1e293b">
    <text x="40" y="130" font-weight="700">Very weak</text>
    <text x="40" y="148" font-size="10.5" fill="#475569">Crumbles / indents</text>
    <text x="40" y="164" font-size="10.5" fill="#475569">with thumb</text>

    <text x="250" y="130" font-weight="700">Weak</text>
    <text x="250" y="148" font-size="10.5" fill="#475569">Peels with pocket knife;</text>
    <text x="250" y="164" font-size="10.5" fill="#475569">crushed by hand</text>

    <text x="390" y="130" font-weight="700">Medium strong</text>
    <text x="390" y="148" font-size="10.5" fill="#475569">Breaks with a firm blow</text>
    <text x="390" y="164" font-size="10.5" fill="#475569">of the geological hammer</text>

    <text x="530" y="130" font-weight="700">Strong</text>
    <text x="530" y="148" font-size="10.5" fill="#475569">Requires many blows;</text>
    <text x="530" y="164" font-size="10.5" fill="#475569">breaks into fragments</text>

    <text x="640" y="130" font-weight="700">Very strong</text>
    <text x="640" y="148" font-size="10.5" fill="#475569">Rings on impact;</text>
    <text x="640" y="164" font-size="10.5" fill="#475569">chips the hammer</text>
  </g>

  <!-- index tests -->
  <text x="40" y="206" font-size="12" font-weight="700" fill="#334155">Two index tests that quantify it</text>

  <rect x="40" y="218" width="340" height="120" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="56" y="240" font-size="12" font-weight="700" fill="#1d4ed8">Point-load index, Is(50)</text>
  <text x="56" y="264" font-size="11" fill="#334155">qu ≈ 20 – 24 × Is(50)</text>
  <line x1="56" y1="276" x2="364" y2="276" stroke="#c7d7f5"/>
  <text x="56" y="296" font-size="10.5" fill="#475569">Portable; usable on irregular core</text>
  <text x="56" y="312" font-size="10.5" fill="#475569">and on cut faces in the field.</text>
  <text x="56" y="330" font-size="10.5" fill="#b91c1c">Size-correct to the 50 mm reference.</text>

  <rect x="400" y="218" width="340" height="120" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="416" y="240" font-size="12" font-weight="700" fill="#15803d">Schmidt rebound hammer</text>
  <text x="416" y="264" font-size="11" fill="#334155">Rebound number R → qu (empirical)</text>
  <line x1="416" y1="276" x2="724" y2="276" stroke="#bbf7d0"/>
  <text x="416" y="296" font-size="10.5" fill="#475569">Fast, non-destructive, surface only.</text>
  <text x="416" y="312" font-size="10.5" fill="#475569">Calibrate against the local rock type.</text>
  <text x="416" y="330" font-size="10.5" fill="#b91c1c">Weak or weathered rock under-reads.</text>

  <!-- note -->
  <rect x="40" y="352" width="700" height="52" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="56" y="374" font-size="11" fill="#9a3412">Field strength is the strength of the intact block. The rock mass is weaker still — joints, weathering and scale cut it further (§9.8, §9.11).</text>
  <text x="56" y="392" font-size="11" fill="#9a3412">Drilling-rig refusal and penetration rate are also usable strength indicators (§6.2–6.3).</text>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look (2007), Ch. 6 — rock strength from classification and testing. Original diagram.</text>
</svg>
