<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">The compaction curve</text>

  <!-- grid -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="130" y1="70"  x2="700" y2="70"/>
    <line x1="130" y1="140" x2="700" y2="140"/>
    <line x1="130" y1="210" x2="700" y2="210"/>
    <line x1="130" y1="280" x2="700" y2="280"/>
    <line x1="130" y1="350" x2="700" y2="350"/>
    <line x1="272" y1="70"  x2="272" y2="350"/>
    <line x1="415" y1="70"  x2="415" y2="350"/>
    <line x1="557" y1="70"  x2="557" y2="350"/>
  </g>

  <!-- axes -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="130" y1="70" x2="130" y2="350"/>
    <line x1="130" y1="350" x2="700" y2="350"/>
  </g>

  <!-- curves -->
  <path d="M 150,342 C 250,255 345,170 430,152 C 520,142 590,188 690,268" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <path d="M 150,300 C 250,205 330,116 405,100 C 490,88 570,140 690,226" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- OMC marker -->
  <line x1="430" y1="152" x2="430" y2="350" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="430" cy="152" r="4" fill="#2b6cb0"/>
  <text x="436" y="344" font-size="11" fill="#666">OMC</text>

  <!-- axis titles -->
  <text x="78" y="215" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 78 215)">Dry unit weight, &#947;<tspan baseline-shift="sub" font-size="9">d</tspan></text>
  <text x="415" y="386" font-size="12" fill="#333" text-anchor="middle">Water content, &#969; (%)</text>

  <!-- legend -->
  <g font-size="11.5" fill="#333">
    <line x1="512" y1="88" x2="548" y2="88" stroke="#c0392b" stroke-width="2.5"/>
    <text x="554" y="92">High effort</text>
    <line x1="512" y1="108" x2="548" y2="108" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="554" y="112">Standard effort</text>
  </g>

  <text x="390" y="410" text-anchor="middle" font-size="11" fill="#999">Schematic after FHWA-NHI-06-088. Not to scale.</text>
</svg>
