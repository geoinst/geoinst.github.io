<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Inclinometer — locating a shear plane</text>

  <!-- ground + layers -->
  <rect x="40" y="90" width="340" height="300" fill="#efe6cf"/>
  <rect x="40" y="240" width="340" height="150" fill="#e3d3a6"/>
  <line x1="40" y1="90" x2="380" y2="90" stroke="#8a7f5f" stroke-width="2"/>

  <!-- casing -->
  <rect x="196" y="90" width="10" height="300" fill="#f0ad4e"/>
  <!-- deformed casing (dashed) -->
  <polyline points="201,90 201,240 215,300 240,360 250,390" stroke="#b9791f" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <!-- probe -->
  <rect x="190" y="250" width="22" height="16" fill="#e08e2e"/>
  <!-- shear plane -->
  <line x1="60" y1="300" x2="370" y2="300" stroke="#e53935" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- displacement profile (right) -->
  <line x1="450" y1="90" x2="450" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="90" x2="740" y2="90" stroke="#333" stroke-width="1.5"/>
  <polyline points="470,95 470,250 490,300 560,340 700,385" fill="none" stroke="#1565c0" stroke-width="3"/>
  <line x1="450" y1="300" x2="740" y2="300" stroke="#e53935" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- labels -->
  <g font-size="12" fill="#222">
    <text x="150" y="120" text-anchor="middle">Inclinometer casing</text>
    <text x="120" y="262" text-anchor="middle" fill="#e08e2e">Probe</text>
    <text x="120" y="294" text-anchor="middle" fill="#e53935">Shear plane</text>
    <text x="595" y="80" text-anchor="middle" fill="#1565c0">Cumulative displacement</text>
    <text x="470" y="408" text-anchor="middle" fill="#666">Depth</text>
    <text x="595" y="408" text-anchor="middle" fill="#666">Deformation concentrated at the shear plane</text>
  </g>
  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from Dunnicliff, Ch. 12. Not to scale.</text>
</svg>
