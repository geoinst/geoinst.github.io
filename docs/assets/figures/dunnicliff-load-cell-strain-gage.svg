<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="360" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Load cells and strain gages</text>

  <!-- Panel A: center-hole load cell on an anchor -->
  <g>
    <text x="195" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Center-hole load cell</text>
    <rect x="40" y="80" width="24" height="240" fill="#9a9a9a"/>
    <rect x="64" y="80" width="316" height="240" fill="#e8d9b0"/>
    <!-- anchor tendon -->
    <line x1="64" y1="150" x2="360" y2="120" stroke="#555" stroke-width="4"/>
    <!-- center-hole load cell ring -->
    <circle cx="95" cy="150" r="18" fill="none" stroke="#8e44ad" stroke-width="6"/>
    <circle cx="95" cy="150" r="7" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
    <!-- jack -->
    <rect x="120" y="134" width="26" height="32" fill="#f0ad4e"/>
    <text x="95" y="196" text-anchor="middle" font-size="11" fill="#8e44ad">Load cell</text>
    <text x="200" y="220" text-anchor="middle" font-size="11" fill="#444">Anchor tendon</text>
    <text x="133" y="130" text-anchor="middle" font-size="11" fill="#c77700">Jack</text>
  </g>

  <!-- Panel B: sister-bar strain gage on rebar -->
  <g>
    <text x="585" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Sister-bar strain gage</text>
    <rect x="440" y="90" width="300" height="200" fill="#d7d2c6"/>
    <text x="590" y="112" text-anchor="middle" font-size="11" fill="#666">Concrete</text>
    <!-- rebar -->
    <line x1="455" y1="200" x2="725" y2="200" stroke="#7a7a7a" stroke-width="8"/>
    <!-- sister bar (gage) -->
    <line x1="455" y1="182" x2="725" y2="182" stroke="#5bc0de" stroke-width="4"/>
    <rect x="575" y="174" width="34" height="16" fill="#2b6cb0"/>
    <text x="590" y="232" text-anchor="middle" font-size="11" fill="#555">Rebar</text>
    <text x="592" y="166" text-anchor="middle" font-size="11" fill="#2b6cb0">VW sister-bar gage</text>
  </g>
  <text x="390" y="344" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from Dunnicliff, Ch. 13. Not to scale.</text>
</svg>
