<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Generic cross-section of a mechanically stabilized earth (MSE) wall</text>

  <!-- retained fill (behind reinforced zone) -->
  <rect x="470" y="96" width="290" height="288" fill="#e3d5b3"/>
  <text x="628" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#7a6633">Retained fill</text>
  <text x="628" y="219" text-anchor="middle" font-size="11" fill="#8a7748">(generates the earth pressure)</text>

  <!-- reinforced fill zone -->
  <rect x="186" y="96" width="284" height="288" fill="#f4ecd8"/>
  <g stroke="#ded1ae" stroke-width="1">
    <line x1="186" y1="128" x2="470" y2="128"/>
    <line x1="186" y1="160" x2="470" y2="160"/>
    <line x1="186" y1="192" x2="470" y2="192"/>
    <line x1="186" y1="224" x2="470" y2="224"/>
    <line x1="186" y1="256" x2="470" y2="256"/>
    <line x1="186" y1="288" x2="470" y2="288"/>
    <line x1="186" y1="320" x2="470" y2="320"/>
    <line x1="186" y1="352" x2="470" y2="352"/>
  </g>
  <text x="330" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#8a6d1f">Reinforced fill</text>
  <text x="330" y="136" text-anchor="middle" font-size="11" fill="#a08b45">(frictional, free-draining)</text>

  <!-- reinforcement layers -->
  <g stroke="#b45309" stroke-width="5" stroke-linecap="round">
    <line x1="196" y1="144" x2="452" y2="144"/>
    <line x1="196" y1="208" x2="452" y2="208"/>
    <line x1="196" y1="272" x2="452" y2="272"/>
    <line x1="196" y1="336" x2="452" y2="336"/>
  </g>
  <text x="470" y="150" font-size="12" font-weight="600" fill="#8a3f06">Reinforcement</text>
  <text x="470" y="166" font-size="11" fill="#a55a1e">strips · grids · geosynthetic</text>

  <!-- drainage column behind facing -->
  <rect x="168" y="96" width="18" height="288" fill="#cbd5e1"/>
  <g fill="#94a3b8">
    <circle cx="173" cy="120" r="3"/><circle cx="182" cy="140" r="3"/><circle cx="173" cy="165" r="3"/>
    <circle cx="182" cy="190" r="3"/><circle cx="173" cy="215" r="3"/><circle cx="182" cy="240" r="3"/>
    <circle cx="173" cy="265" r="3"/><circle cx="182" cy="290" r="3"/><circle cx="173" cy="315" r="3"/>
    <circle cx="182" cy="340" r="3"/><circle cx="173" cy="362" r="3"/>
  </g>

  <!-- facing panels -->
  <rect x="150" y="90" width="18" height="294" fill="#a8a8a8" stroke="#7d7d7d"/>
  <g stroke="#8f8f8f" stroke-width="1">
    <line x1="150" y1="138" x2="168" y2="138"/>
    <line x1="150" y1="186" x2="168" y2="186"/>
    <line x1="150" y1="234" x2="168" y2="234"/>
    <line x1="150" y1="282" x2="168" y2="282"/>
    <line x1="150" y1="330" x2="168" y2="330"/>
  </g>

  <!-- levelling pad -->
  <rect x="138" y="384" width="48" height="14" fill="#9aa0a6" stroke="#6f757b"/>

  <!-- foundation soil -->
  <rect x="30" y="384" width="730" height="56" fill="#d8d2c4"/>
  <text x="60" y="420" font-size="13" font-weight="600" fill="#6f6a5c">Foundation soil</text>

  <!-- ground surface line -->
  <line x1="150" y1="90" x2="760" y2="90" stroke="#8a8a8a" stroke-width="2"/>

  <!-- height dimension H -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <line x1="122" y1="90" x2="122" y2="384"/>
    <path d="M118 96 L122 88 L126 96" />
    <path d="M118 378 L122 386 L126 378" />
  </g>
  <text x="112" y="240" text-anchor="end" font-size="13" font-weight="700" fill="#1d4ed8">H</text>

  <!-- length dimension L -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <line x1="186" y1="408" x2="470" y2="408"/>
    <path d="M192 404 L184 408 L192 412"/>
    <path d="M464 404 L472 408 L464 412"/>
  </g>
  <text x="328" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">L  ≥  0.7 H</text>

  <!-- labels with leaders -->
  <line x1="120" y1="118" x2="150" y2="130" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="116" y="114" text-anchor="end" font-size="12" font-weight="600" fill="#444">Facing panels</text>

  <line x1="196" y1="120" x2="186" y2="126" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="200" y="98" font-size="12" font-weight="600" fill="#444">Drainage column + filter</text>

  <line x1="150" y1="396" x2="150" y2="410" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="60" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#444">Levelling pad</text>

  <!-- note -->
  <text x="30" y="452" font-size="10.5" fill="#777">After FHWA-NHI-00-043, Ch. 1–2. Reinforcement is gripped by friction in the fill; the mass behaves as a gravity structure.</text>
</svg>
