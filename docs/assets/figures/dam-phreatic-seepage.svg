<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Seepage and the phreatic surface</text>

  <!-- foundation -->
  <rect x="20" y="310" width="740" height="40" fill="#b8b0a2"/>
  <!-- reservoir -->
  <polygon points="20,180 285,180 190,310 20,310" fill="#9ec9ec"/>
  <!-- embankment -->
  <polygon points="190,310 330,110 450,110 650,310" fill="#c79a5b"/>
  <!-- core -->
  <polygon points="360,110 410,110 500,310 300,310" fill="#8a7f5f"/>
  <!-- toe drain + weir -->
  <rect x="560" y="290" width="90" height="20" fill="#7a6a4f"/>
  <rect x="648" y="296" width="20" height="14" fill="#2c7c4d"/>

  <!-- phreatic surface through dam -->
  <polyline points="190,300 285,182 360,190 450,235 560,285 650,308" stroke="#2b6cb0" stroke-width="2.5" stroke-dasharray="8 5" fill="none"/>
  <!-- seepage flow arrows -->
  <g stroke="#2b6cb0" stroke-width="1.6" fill="#2b6cb0">
    <line x1="300" y1="220" x2="340" y2="215"/><polygon points="340,215 330,211 330,219"/>
    <line x1="470" y1="250" x2="520" y2="268"/><polygon points="520,268 510,262 508,272"/>
  </g>
  <!-- seepage emerging at toe -->
  <path d="M650,306 q10,10 26,10" stroke="#2b6cb0" stroke-width="2" fill="none"/>

  <!-- labels -->
  <g font-size="12" fill="#222">
    <text x="95" y="250" text-anchor="middle">Reservoir</text>
    <text x="470" y="150" text-anchor="middle" fill="#2b6cb0">Phreatic surface</text>
    <text x="560" y="240" text-anchor="middle" fill="#444" font-size="11">Seepage</text>
    <text x="605" y="285" text-anchor="middle" fill="#444" font-size="11">Toe drain</text>
    <text x="690" y="340" text-anchor="middle" fill="#2c7c4d" font-size="11">Measuring weir</text>
  </g>
  <text x="390" y="372" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from ASCE MOP-135 scope. Not to scale.</text>
</svg>
