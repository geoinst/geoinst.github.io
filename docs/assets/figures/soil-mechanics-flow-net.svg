<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Flow net beneath a sheet pile wall</text>

  <!-- soil mass -->
  <polygon points="110,190 390,190 390,240 670,240 670,372 110,372" fill="#d8cba8" stroke="#b3a074" stroke-width="1"/>

  <!-- water on upstream side -->
  <rect x="110" y="158" width="280" height="32" fill="#cfe3f7"/>
  <line x1="110" y1="158" x2="390" y2="158" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="120" y="151" font-size="11" fill="#1565c0">Upstream water level (H&#8321;)</text>

  <!-- water on downstream side -->
  <rect x="390" y="208" width="280" height="32" fill="#cfe3f7"/>
  <line x1="390" y1="208" x2="670" y2="208" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="500" y="201" font-size="11" fill="#1565c0">Downstream level (H&#8322;)</text>

  <!-- sheet pile wall -->
  <rect x="382" y="96" width="12" height="214" fill="#555" stroke="#333" stroke-width="1"/>
  <text x="368" y="90" font-size="11" fill="#333" text-anchor="end">Sheet pile wall</text>

  <!-- flow lines -->
  <g fill="none" stroke="#2b6cb0" stroke-width="2">
    <path d="M 150,190 C 205,300 285,332 400,336 C 505,336 585,300 660,242"/>
    <path d="M 250,190 C 300,306 355,352 410,356 C 490,354 560,320 625,246"/>
    <path d="M 350,190 C 378,286 405,340 435,352 C 490,350 545,322 590,250"/>
  </g>
  <!-- flow arrows -->
  <g fill="#2b6cb0">
    <polygon points="252,268 245,281 259,279"/>
    <polygon points="352,320 345,333 359,331"/>
  </g>

  <!-- equipotential lines -->
  <g fill="none" stroke="#8a5a2b" stroke-width="1.6" stroke-dasharray="6 4">
    <path d="M 200,190 C 208,262 216,308 232,338"/>
    <path d="M 296,196 C 306,282 316,326 336,348"/>
    <path d="M 470,338 C 492,326 502,296 508,248"/>
    <path d="M 566,300 C 580,288 590,268 596,248"/>
  </g>

  <!-- legend -->
  <g font-size="11.5" fill="#333">
    <line x1="560" y1="88" x2="600" y2="88" stroke="#2b6cb0" stroke-width="2"/>
    <text x="606" y="92">Flow lines</text>
    <line x1="560" y1="108" x2="600" y2="108" stroke="#8a5a2b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="606" y="112">Equipotential lines</text>
  </g>

  <!-- wall tip label -->
  <circle cx="388" cy="310" r="3.5" fill="#333"/>
  <text x="396" y="314" font-size="11" fill="#333">Wall tip</text>

  <text x="390" y="404" text-anchor="middle" font-size="11" fill="#999">Schematic after USACE seepage guidance. Not to scale.</text>
</svg>
