<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Piezometer types</text>

  <!-- Panel 1: VW -->
  <g>
    <text x="115" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Vibrating-wire (VW)</text>
    <rect x="35" y="110" width="160" height="210" fill="#efe6cf"/>
    <rect x="35" y="250" width="160" height="70" fill="#e3d3a6"/>
    <polyline points="35,180 195,180" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <line x1="115" y1="300" x2="115" y2="110" stroke="#d9534f" stroke-width="3"/>
    <circle cx="115" cy="300" r="9" fill="#d9534f"/>
    <rect x="105" y="100" width="20" height="14" fill="#555"/>
    <text x="115" y="345" text-anchor="middle" font-size="11" fill="#666">Auto, robust, long-term</text>
  </g>

  <!-- Panel 2: Pneumatic -->
  <g>
    <text x="295" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Pneumatic</text>
    <rect x="215" y="110" width="160" height="210" fill="#efe6cf"/>
    <rect x="215" y="250" width="160" height="70" fill="#e3d3a6"/>
    <polyline points="215,180 375,180" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <line x1="295" y1="300" x2="295" y2="110" stroke="#4caf50" stroke-width="3"/>
    <circle cx="295" cy="300" r="9" fill="#4caf50"/>
    <line x1="308" y1="110" x2="308" y2="80" stroke="#4caf50" stroke-width="3"/>
    <circle cx="308" cy="76" r="6" fill="none" stroke="#4caf50" stroke-width="2"/>
    <text x="295" y="345" text-anchor="middle" font-size="11" fill="#666">No power; remote</text>
  </g>

  <!-- Panel 3: Standpipe -->
  <g>
    <text x="475" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Standpipe (open)</text>
    <rect x="395" y="110" width="160" height="210" fill="#efe6cf"/>
    <rect x="395" y="250" width="160" height="70" fill="#e3d3a6"/>
    <polyline points="395,180 555,180" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <rect x="468" y="150" width="14" height="170" fill="#9ec9ec"/>
    <line x1="475" y1="180" x2="475" y2="150" stroke="#2b6cb0" stroke-width="2"/>
    <text x="475" y="345" text-anchor="middle" font-size="11" fill="#666">Simple, direct, slow</text>
  </g>

  <!-- Panel 4: Hydraulic twin-tube -->
  <g>
    <text x="655" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Hydraulic (twin-tube)</text>
    <rect x="575" y="110" width="160" height="210" fill="#efe6cf"/>
    <rect x="575" y="250" width="160" height="70" fill="#e3d3a6"/>
    <polyline points="575,180 735,180" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <line x1="645" y1="300" x2="645" y2="110" stroke="#f0ad4e" stroke-width="2.5"/>
    <line x1="665" y1="300" x2="665" y2="110" stroke="#2b6cb0" stroke-width="2.5"/>
    <circle cx="645" cy="300" r="9" fill="#f0ad4e"/>
    <text x="655" y="345" text-anchor="middle" font-size="11" fill="#666">Multiple points; proven</text>
  </g>

  <text x="390" y="368" text-anchor="middle" font-size="11" fill="#666">Schematic adapted from Dunnicliff, Ch. 9. Shaded band = filter pack; dashed = phreatic surface. Not to scale.</text>
</svg>
