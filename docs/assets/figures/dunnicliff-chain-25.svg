<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">The chain of 25 links</text>

  <!-- chain links: alternating horizontal / vertical, spacing 60, start x=80 -->
  <g fill="none" stroke="#4a4a4a" stroke-width="6" stroke-linejoin="round">
    <!-- H --> <rect x="34"  y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="127" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="94"  y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="187" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="154" y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="247" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="214" y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="307" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="274" y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="367" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="334" y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="427" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="394" y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="487" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="454" y="135" width="92" height="30" rx="11"/>
    <!-- V --> <rect x="547" y="118" width="26" height="64" rx="11"/>
    <!-- H --> <rect x="514" y="135" width="92" height="30" rx="11"/>
  </g>

  <text x="80" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Project need</text>
  <text x="560" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">Decision</text>

  <text x="390" y="215" text-anchor="middle" font-size="13" fill="#444">25 links — define need · plan · procure · install · calibrate · read · maintain · interpret · act</text>
  <text x="390" y="250" text-anchor="middle" font-size="12" fill="#666">Break any link and the chain fails. Reliability is the chain made operational.</text>
  <text x="390" y="300" text-anchor="middle" font-size="11" fill="#999">Adapted from Dunnicliff, Ch. 10 &amp; 14.</text>
</svg>
