<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Bearing-capacity failure modes</text>

  <!-- panel helper: ground at y=170..390 -->
  <g>
    <!-- Panel 1: general shear -->
    <rect x="30" y="170" width="230" height="210" fill="#efe6cf"/>
    <line x1="30" y1="170" x2="260" y2="170" stroke="#8a7f5f" stroke-width="2"/>
    <rect x="105" y="140" width="80" height="30" fill="#b0b8c2" stroke="#6b7480"/>
    <!-- slip surface -->
    <path d="M110,170 Q80,210 60,170" fill="none" stroke="#c53030" stroke-width="2.5"/>
    <path d="M180,170 Q210,210 230,170" fill="none" stroke="#c53030" stroke-width="2.5"/>
    <path d="M110,170 Q145,230 180,170" fill="none" stroke="#c53030" stroke-width="2.5" stroke-dasharray="5 4"/>
    <!-- heave arrows -->
    <polygon points="60,158 54,168 66,168" fill="#c53030"/>
    <polygon points="230,158 224,168 236,168" fill="#c53030"/>
    <text x="145" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">General shear</text>
    <text x="145" y="400" text-anchor="middle" font-size="10.5" fill="#666">brittle · dense/stiff</text>
  </g>

  <g>
    <!-- Panel 2: local shear -->
    <rect x="275" y="170" width="230" height="210" fill="#efe6cf"/>
    <line x1="275" y1="170" x2="505" y2="170" stroke="#8a7f5f" stroke-width="2"/>
    <rect x="350" y="146" width="80" height="24" fill="#b0b8c2" stroke="#6b7480"/>
    <path d="M355,170 Q335,200 320,178" fill="none" stroke="#c53030" stroke-width="2.5"/>
    <path d="M425,170 Q445,200 460,178" fill="none" stroke="#c53030" stroke-width="2.5"/>
    <polygon points="320,166 314,176 326,176" fill="#c53030"/>
    <polygon points="460,166 454,176 466,176" fill="#c53030"/>
    <text x="390" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">Local shear</text>
    <text x="390" y="400" text-anchor="middle" font-size="10.5" fill="#666">medium-dense</text>
  </g>

  <g>
    <!-- Panel 3: punching shear -->
    <rect x="520" y="170" width="230" height="210" fill="#efe6cf"/>
    <line x1="520" y1="170" x2="750" y2="170" stroke="#8a7f5f" stroke-width="2"/>
    <rect x="595" y="188" width="80" height="34" fill="#b0b8c2" stroke="#6b7480"/>
    <!-- vertical settlement arrows -->
    <line x1="635" y1="150" x2="635" y2="182" stroke="#c53030" stroke-width="2.5"/>
    <polygon points="635,186 629,174 641,174" fill="#c53030"/>
    <path d="M595,222 Q600,260 612,300" fill="none" stroke="#c53030" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M675,222 Q670,260 658,300" fill="none" stroke="#c53030" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="635" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">Punching shear</text>
    <text x="635" y="400" text-anchor="middle" font-size="10.5" fill="#666">ductile · loose/soft</text>
  </g>

  <text x="390" y="416" text-anchor="middle" font-size="11" fill="#999">Schematic after USACE EM 1110-1-1905. Not to scale.</text>
</svg>
