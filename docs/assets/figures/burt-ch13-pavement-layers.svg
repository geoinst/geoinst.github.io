<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Pavement layers — CBR, modulus and the subgrade</text>

  <!-- layered section -->
  <g>
    <rect x="60" y="70" width="420" height="40" fill="#3f3f46"/>
    <text x="76" y="95" font-size="12" font-weight="700" fill="#ffffff">Asphalt surfacing</text>

    <rect x="60" y="110" width="420" height="52" fill="#78716c"/>
    <text x="76" y="134" font-size="12" font-weight="700" fill="#ffffff">Base course</text>
    <text x="76" y="152" font-size="10.5" fill="#e7e5e4">crushed rock, well graded</text>

    <rect x="60" y="162" width="420" height="52" fill="#a8a29e"/>
    <text x="76" y="186" font-size="12" font-weight="700" fill="#1c1917">Sub-base</text>
    <text x="76" y="204" font-size="10.5" fill="#292524">granular, less strict</text>

    <rect x="60" y="214" width="420" height="70" fill="#d6d3d1"/>
    <text x="76" y="240" font-size="12" font-weight="700" fill="#1c1917">Subgrade</text>
    <text x="76" y="258" font-size="10.5" fill="#292524">in-situ soil — the weak link</text>

    <rect x="60" y="284" width="420" height="90" fill="#e7e5e4"/>
    <text x="76" y="332" font-size="11" fill="#57534e">natural ground</text>
  </g>

  <!-- load arrows -->
  <g stroke="#dc2626" stroke-width="2.5">
    <line x1="140" y1="46" x2="140" y2="68"/>
    <line x1="270" y1="46" x2="270" y2="68"/>
    <line x1="400" y1="46" x2="400" y2="68"/>
  </g>
  <path d="M134 60 L140 70 L146 60" fill="#dc2626"/>
  <path d="M264 60 L270 70 L276 60" fill="#dc2626"/>
  <path d="M394 60 L400 70 L406 60" fill="#dc2626"/>
  <text x="470" y="60" font-size="10.5" fill="#dc2626" font-weight="600">traffic load spreads</text>

  <!-- property table -->
  <rect x="500" y="70" width="252" height="176" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="92" font-size="11.5" font-weight="700" fill="#334155">Layer</text>
  <text x="640" y="92" font-size="11.5" font-weight="700" fill="#334155">CBR (%)</text>
  <text x="716" y="92" font-size="11.5" font-weight="700" fill="#334155">E (MPa)</text>
  <line x1="512" y1="102" x2="740" y2="102" stroke="#e2e8f0"/>
  <g font-size="10.5" fill="#475569">
    <text x="512" y="122">Base</text><text x="640" y="122">80–100</text><text x="716" y="122">200–400</text>
    <text x="512" y="142">Sub-base</text><text x="640" y="142">30–60</text><text x="716" y="142">100–200</text>
    <text x="512" y="162">Sand subgrade</text><text x="640" y="162">15–40</text><text x="716" y="162">50–150</text>
    <text x="512" y="182">Silty clay</text><text x="640" y="182">4–8</text><text x="716" y="182">20–60</text>
    <text x="512" y="202">Heavy clay (CH)</text><text x="640" y="202">2–5</text><text x="716" y="202">10–40</text>
  </g>
  <line x1="512" y1="214" x2="740" y2="214" stroke="#e2e8f0"/>
  <text x="512" y="234" font-size="10.5" fill="#1d4ed8" font-weight="700">E (MPa) ≈ 5–10 × CBR</text>

  <!-- expansive clay box -->
  <rect x="500" y="258" width="252" height="116" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="512" y="278" font-size="11" font-weight="700" fill="#9a3412">Expansive clay is the enemy</text>
  <line x1="512" y1="288" x2="740" y2="288" stroke="#fed7aa"/>
  <text x="512" y="306" font-size="10.5" fill="#7c2d12">PI &gt; 25 → high shrink–swell</text>
  <text x="512" y="324" font-size="10.5" fill="#7c2d12">PI &gt; 40 → very high</text>
  <text x="512" y="344" font-size="10.5" fill="#7c2d12">Lime stabilisation cuts PI</text>
  <text x="512" y="362" font-size="10.5" fill="#b91c1c" font-weight="600">Use soaked CBR in the wet tropics.</text>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look (2007), Ch. 13 — subgrades and pavements. Original diagram.</text>
</svg>
