<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="360" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Đường cơ sở, thi công và vận hành</text>

  <!-- baseline shaded region -->
  <rect x="90" y="70" width="130" height="230" fill="#e8f5e9"/>
  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="300" x2="720" y2="300" stroke="#333" stroke-width="2"/>
  <text x="405" y="340" text-anchor="middle" font-size="12" fill="#222">Thời gian</text>
  <text x="36" y="185" text-anchor="middle" font-size="12" fill="#222" transform="rotate(-90 36 185)">Số đọc</text>

  <!-- threshold -->
  <line x1="90" y1="120" x2="720" y2="120" stroke="#e53935" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="700" y="112" text-anchor="end" font-size="11" fill="#e53935">Ngưỡng</text>

  <!-- monitored reading -->
  <polyline points="100,290 150,289 200,288 260,280 330,240 420,200 520,165 620,150 710,145" fill="none" stroke="#1565c0" stroke-width="3"/>

  <!-- event markers -->
  <g stroke="#c77700" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="220" y1="70" x2="220" y2="300"/>
    <line x1="330" y1="70" x2="330" y2="300"/>
  </g>
  <text x="220" y="62" text-anchor="middle" font-size="11" fill="#c77700">Bắt đầu</text>
  <text x="330" y="62" text-anchor="middle" font-size="11" fill="#c77700">nâng cấp / sự kiện</text>

  <!-- phase labels -->
  <text x="155" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">Đường cơ sở</text>
  <text x="400" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#c77700">Thi công</text>
  <text x="620" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">Vận hành</text>

  <text x="390" y="356" text-anchor="middle" font-size="11" fill="#999">Đánh giá thay đổi so với đường cơ sở; vẽ theo yếu tố chi phối (tải, mưa, hồ chứa). Phỏng theo Dunnicliff, Ch. 18.</text>
</svg>
