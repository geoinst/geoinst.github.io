<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Landslide velocity scale, erosion and subsurface drainage</text>

  <!-- LEFT: velocity scale -->
  <text x="196" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Landslide velocity scale (WP/WLI)</text>

  <g>
    <rect x="40" y="70" width="312" height="30" fill="#fee2e2"/>
    <rect x="40" y="100" width="312" height="30" fill="#ffedd5"/>
    <rect x="40" y="130" width="312" height="30" fill="#fef9c3"/>
    <rect x="40" y="160" width="312" height="30" fill="#ecfccb"/>
    <rect x="40" y="190" width="312" height="30" fill="#dcfce7"/>
    <rect x="40" y="220" width="312" height="30" fill="#d1fae5"/>
    <rect x="40" y="250" width="312" height="30" fill="#ccfbf1"/>
  </g>
  <g font-size="10.5" fill="#334155">
    <text x="50" y="90" font-weight="700">7 — extremely rapid</text><text x="342" y="90" text-anchor="end">&gt; 5 m/s</text>
    <text x="50" y="120" font-weight="700">6 — very rapid</text><text x="342" y="120" text-anchor="end">3 m/min – 5 m/s</text>
    <text x="50" y="150" font-weight="700">5 — rapid</text><text x="342" y="150" text-anchor="end">1.8 m/h – 3 m/min</text>
    <text x="50" y="180" font-weight="700">4 — moderate</text><text x="342" y="180" text-anchor="end">13 mm/month – 1.8 m/h</text>
    <text x="50" y="210" font-weight="700">3 — slow</text><text x="342" y="210" text-anchor="end">1.6 m/yr – 13 mm/month</text>
    <text x="50" y="240" font-weight="700">2 — very slow</text><text x="342" y="240" text-anchor="end">16 mm/yr – 1.6 m/yr</text>
    <text x="50" y="270" font-weight="700">1 — extremely slow</text><text x="342" y="270" text-anchor="end">&lt; 16 mm/yr</text>
  </g>

  <rect x="40" y="292" width="312" height="52" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="54" y="312" font-size="10.5" fill="#9a3412">Classes 1–3: monitor and treat. Classes 5–7: evacuate.</text>
  <text x="54" y="330" font-size="10.5" fill="#b91c1c" font-weight="600">The velocity class dictates the response, not the volume.</text>

  <!-- RIGHT TOP: subsurface drains -->
  <text x="580" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Drainage measures</text>

  <rect x="400" y="70" width="360" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- slope -->
  <path d="M410 200 L470 90 L740 90 L740 200 Z" fill="#e8e0cf" stroke="#a8a29e"/>
  <!-- phreatic line -->
  <path d="M470 110 C540 130 620 160 740 172" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="640" y="164" font-size="9.5" fill="#1d4ed8">phreatic surface</text>
  <!-- french drain (trench drain) -->
  <polygon points="470,90 486,90 486,190 470,190" fill="#94a3b8" stroke="#475569"/>
  <g fill="#64748b">
    <circle cx="478" cy="110" r="2.4"/><circle cx="478" cy="126" r="2.4"/><circle cx="478" cy="142" r="2.4"/>
    <circle cx="478" cy="158" r="2.4"/><circle cx="478" cy="174" r="2.4"/>
  </g>
  <text x="492" y="108" font-size="9.5" fill="#334155">stone-filled trench drain</text>
  <!-- counterfort / blanket -->
  <polygon points="560,200 640,200 640,182 560,190" fill="#cbd5e1" stroke="#64748b"/>
  <text x="600" y="216" text-anchor="middle" font-size="9.5" fill="#334155">drainage blanket</text>

  <!-- RIGHT BOTTOM: erosion velocity -->
  <text x="580" y="248" font-size="12" font-weight="700" fill="#334155">Permissible velocity before erosion</text>
  <rect x="400" y="258" width="360" height="116" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="10.5" fill="#475569">
    <text x="414" y="280">Fine sand</text><text x="746" y="280" text-anchor="end">0.3 – 0.6 m/s</text>
    <text x="414" y="298">Coarse sand</text><text x="746" y="298" text-anchor="end">0.6 – 1.2 m/s</text>
    <text x="414" y="316">Gravel</text><text x="746" y="316" text-anchor="end">1.2 – 1.8 m/s</text>
    <text x="414" y="334">Stiff clay</text><text x="746" y="334" text-anchor="end">1.8 – 2.5 m/s</text>
    <text x="414" y="352">Soft rock</text><text x="746" y="352" text-anchor="end">2.5 – 4.0 m/s</text>
    <text x="414" y="370">Hard rock</text><text x="746" y="370" text-anchor="end">&gt; 4.0 m/s</text>
  </g>

  <rect x="400" y="384" width="360" height="52" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="414" y="404" font-size="10.5" fill="#1e3a8a" font-weight="600">Piping filter criteria (USACE):</text>
  <text x="414" y="422" font-size="10" fill="#334155">D₁₅(filter)/D₈₅(soil) = 4–5 ·  D₅₀(filter)/D₅₀(soil) &lt; 25</text>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look (2007), Ch. 15 — terrain assessment, drainage and erosion. Original diagram.</text>
</svg>
