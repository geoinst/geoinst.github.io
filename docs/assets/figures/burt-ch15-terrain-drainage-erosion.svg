<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Thang vận tốc trượt lở, xói mòn và thoát nước ngầm</text>

  <!-- LEFT: velocity scale -->
  <text x="196" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Thang vận tốc trượt lở (WP/WLI)</text>

  <g>
    <rect x="40" y="70" width="312" height="30" fill="#fee2e2"/>
    <rect x="40" y="100" width="312" height="30" fill="#ffedd5"/>
    <rect x="40" y="130" width="312" height="30" fill="#fef9c3"/>
    <rect x="40" y="160" width="312" height="30" fill="#ecfccb"/>
    <rect x="40" y="190" width="312" height="30" fill="#dcfce7"/>
    <rect x="40" y="220" width="312" height="30" fill="#d1fae5"/>
    <rect x="40" y="250" width="312" height="30" fill="#ccfbf1"/>
  </g>
  <g font-size="10.5" fill="#334155">
    <text x="50" y="90" font-weight="700">7 — cực nhanh</text><text x="342" y="90" text-anchor="end">&gt; 5 m/s</text>
    <text x="50" y="120" font-weight="700">6 — rất nhanh</text><text x="342" y="120" text-anchor="end">3 m/min – 5 m/s</text>
    <text x="50" y="150" font-weight="700">5 — nhanh</text><text x="342" y="150" text-anchor="end">1.8 m/h – 3 m/min</text>
    <text x="50" y="180" font-weight="700">4 — trung bình</text><text x="342" y="180" text-anchor="end">13 mm/tháng – 1,8 m/h</text>
    <text x="50" y="210" font-weight="700">3 — chậm</text><text x="342" y="210" text-anchor="end">1,6 m/năm – 13 mm/tháng</text>
    <text x="50" y="240" font-weight="700">2 — rất chậm</text><text x="342" y="240" text-anchor="end">16 mm/năm – 1,6 m/năm</text>
    <text x="50" y="270" font-weight="700">1 — cực chậm</text><text x="342" y="270" text-anchor="end">&lt; 16 mm/năm</text>
  </g>

  <rect x="40" y="292" width="312" height="52" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="54" y="312" font-size="10.5" fill="#9a3412">Cấp 1–3: quan trắc và xử lý. Cấp 5–7: sơ tán.</text>
  <text x="54" y="330" font-size="10.5" fill="#b91c1c" font-weight="600">Cấp vận tốc quyết định biện pháp ứng phó, không phải thể tích.</text>

  <!-- RIGHT TOP: subsurface drains -->
  <text x="580" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Các biện pháp thoát nước</text>

  <rect x="400" y="70" width="360" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- slope -->
  <path d="M410 200 L470 90 L740 90 L740 200 Z" fill="#e8e0cf" stroke="#a8a29e"/>
  <!-- phreatic line -->
  <path d="M470 110 C540 130 620 160 740 172" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="640" y="164" font-size="9.5" fill="#1d4ed8">mặt nước ngầm</text>
  <!-- french drain (trench drain) -->
  <polygon points="470,90 486,90 486,190 470,190" fill="#94a3b8" stroke="#475569"/>
  <g fill="#64748b">
    <circle cx="478" cy="110" r="2.4"/><circle cx="478" cy="126" r="2.4"/><circle cx="478" cy="142" r="2.4"/>
    <circle cx="478" cy="158" r="2.4"/><circle cx="478" cy="174" r="2.4"/>
  </g>
  <text x="492" y="108" font-size="9.5" fill="#334155">rãnh thoát nước đổ đá</text>
  <!-- counterfort / blanket -->
  <polygon points="560,200 640,200 640,182 560,190" fill="#cbd5e1" stroke="#64748b"/>
  <text x="600" y="216" text-anchor="middle" font-size="9.5" fill="#334155">lớp đệm thoát nước</text>

  <!-- RIGHT BOTTOM: erosion velocity -->
  <text x="580" y="248" font-size="12" font-weight="700" fill="#334155">Vận tốc cho phép trước khi xói</text>
  <rect x="400" y="258" width="360" height="116" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="10.5" fill="#475569">
    <text x="414" y="280">Cát mịn</text><text x="746" y="280" text-anchor="end">0.3 – 0.6 m/s</text>
    <text x="414" y="298">Cát thô</text><text x="746" y="298" text-anchor="end">0.6 – 1.2 m/s</text>
    <text x="414" y="316">Sỏi</text><text x="746" y="316" text-anchor="end">1.2 – 1.8 m/s</text>
    <text x="414" y="334">Sét cứng</text><text x="746" y="334" text-anchor="end">1.8 – 2.5 m/s</text>
    <text x="414" y="352">Đá mềm</text><text x="746" y="352" text-anchor="end">2.5 – 4.0 m/s</text>
    <text x="414" y="370">Đá cứng</text><text x="746" y="370" text-anchor="end">&gt; 4.0 m/s</text>
  </g>

  <rect x="400" y="384" width="360" height="52" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="414" y="404" font-size="10.5" fill="#1e3a8a" font-weight="600">Tiêu chuẩn lọc chống xói ngầm (USACE):</text>
  <text x="414" y="422" font-size="10" fill="#334155">D₁₅(lọc)/D₈₅(đất) = 4–5 ·  D₅₀(lọc)/D₅₀(đất) &lt; 25</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look (2007), Ch. 15 — đánh giá địa hình, thoát nước và xói mòn. Sơ đồ gốc.</text>
</svg>
