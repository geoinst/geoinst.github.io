<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Các cơ chế phá hoại mái dốc và hệ số an toàn bảo vệ chúng</text>

  <!-- four panels -->
  <!-- 1. planar -->
  <g>
    <text x="105" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Phẳng (đá)</text>
    <path d="M30 200 L60 90 L180 90 L180 200 Z" fill="#e7e2d8" stroke="#78716c"/>
    <line x1="30" y1="200" x2="110" y2="70" stroke="#334155" stroke-width="2"/>
    <path d="M75 118 L120 90" stroke="#dc2626" stroke-width="3"/>
    <path d="M114 84 L124 88 L116 96" fill="#dc2626"/>
    <text x="105" y="220" text-anchor="middle" font-size="10" fill="#475569">trượt trên một khe nứt</text>
  </g>

  <!-- 2. wedge -->
  <g>
    <text x="295" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Nêm (đá)</text>
    <path d="M220 200 L250 90 L370 90 L370 200 Z" fill="#e7e2d8" stroke="#78716c"/>
    <polygon points="270,90 320,90 300,150" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    <line x1="270" y1="90" x2="300" y2="150" stroke="#dc2626" stroke-width="2"/>
    <line x1="320" y1="90" x2="300" y2="150" stroke="#dc2626" stroke-width="2"/>
    <text x="295" y="220" text-anchor="middle" font-size="10" fill="#475569">hai khe nứt giao nhau</text>
  </g>

  <!-- 3. toppling -->
  <g>
    <text x="485" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Lật (đá)</text>
    <path d="M410 200 L440 90 L560 90 L560 200 Z" fill="#e7e2d8" stroke="#78716c"/>
    <g stroke="#57534e" stroke-width="1.4">
      <line x1="450" y1="90" x2="450" y2="200"/>
      <line x1="470" y1="90" x2="470" y2="200"/>
      <line x1="490" y1="90" x2="490" y2="200"/>
      <line x1="510" y1="90" x2="510" y2="200"/>
      <line x1="530" y1="90" x2="530" y2="200"/>
    </g>
    <path d="M478 100 L520 82" stroke="#dc2626" stroke-width="3"/>
    <path d="M512 76 L526 80 L514 90" fill="#dc2626"/>
    <text x="485" y="220" text-anchor="middle" font-size="10" fill="#475569">các cột xoay về phía trước</text>
  </g>

  <!-- 4. circular -->
  <g>
    <text x="675" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Tròn (đất)</text>
    <path d="M600 200 L600 90 L760 90 L760 200 Z" fill="#e8e0cf" stroke="#a8a29e"/>
    <path d="M600 90 C650 90 700 120 760 190" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 4"/>
    <path d="M600 90 C640 140 690 170 760 190" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="675" y="220" text-anchor="middle" font-size="10" fill="#475569">trượt xoay trong đất</text>
  </g>

  <!-- dividing line -->
  <line x1="30" y1="238" x2="750" y2="238" stroke="#e2e8f0"/>

  <!-- FS table -->
  <text x="30" y="262" font-size="12" font-weight="700" fill="#334155">Hệ số an toàn tối thiểu</text>

  <rect x="30" y="272" width="350" height="120" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="10.5" fill="#475569">
    <text x="44" y="294">Mái dốc tạm</text><text x="366" y="294" text-anchor="end">1.2 – 1.3</text>
    <text x="44" y="314">Mái dốc lâu dài, tĩnh</text><text x="366" y="314" text-anchor="end">1.5</text>
    <text x="44" y="334">Mái dốc lâu dài, động đất</text><text x="366" y="334" text-anchor="end">1.0 – 1.1</text>
    <text x="44" y="354">Mái dốc hiện hữu (đã kiểm chứng)</text><text x="366" y="354" text-anchor="end">có thể chấp nhận thấp hơn</text>
    <text x="44" y="374">Mái dốc đào, lâu dài</text><text x="366" y="374" text-anchor="end">1.5</text>
  </g>

  <rect x="400" y="272" width="350" height="120" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="414" y="294" font-size="11" font-weight="700" fill="#9a3412">Thân đập — kiểm tra cả bốn trường hợp</text>
  <line x1="414" y1="304" x2="736" y2="304" stroke="#fed7aa"/>
  <g font-size="10.5" fill="#7c2d12">
    <text x="414" y="322">Cuối thi công</text><text x="736" y="322" text-anchor="end">1.3</text>
    <text x="414" y="340">Thấm ổn định</text><text x="736" y="340" text-anchor="end">1.5</text>
    <text x="414" y="358">Hạ nhanh mực nước</text><text x="736" y="358" text-anchor="end">1.2 – 1.3</text>
    <text x="414" y="376">Động đất</text><text x="736" y="376" text-anchor="end">1.0 – 1.1</text>
  </g>

  <rect x="30" y="402" width="720" height="34" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="44" y="423" font-size="11" fill="#1e3a8a" font-weight="600">Cơ chế do nền đất đá quyết định: đá phá hoại dọc khe nứt, đất phá hoại trên mặt cong. Đọc địa chất trước khi chọn phương pháp phân tích.</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look (2007), Ch. 14 — mái dốc, cơ chế phá hoại và hệ số an toàn. Sơ đồ gốc.</text>
</svg>
