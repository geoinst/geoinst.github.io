<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Ground-improvement methods</text>

  <!-- panel 1: stone columns -->
  <g>
    <rect x="30" y="90" width="170" height="250" fill="#e3d3a6"/>
    <line x1="30" y1="90" x2="200" y2="90" stroke="#8a7f5f" stroke-width="2"/>
    <g fill="#9aa4b0" stroke="#6b7480">
      <rect x="60" y="120" width="24" height="220"/>
      <rect x="120" y="120" width="24" height="220"/>
    </g>
    <text x="115" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Stone columns</text>
    <text x="115" y="364" text-anchor="middle" font-size="10.5" fill="#666">vibro-replacement</text>
  </g>

  <!-- panel 2: dynamic compaction -->
  <g>
    <rect x="215" y="90" width="170" height="250" fill="#efe6cf"/>
    <line x1="215" y1="90" x2="385" y2="90" stroke="#8a7f5f" stroke-width="2"/>
    <rect x="280" y="60" width="40" height="40" fill="#6b7480"/>
    <line x1="300" y1="100" x2="300" y2="120" stroke="#333" stroke-width="2" stroke-dasharray="3 3"/>
    <g fill="none" stroke="#c07a1f" stroke-width="2">
      <path d="M260,150 Q300,180 340,150"/>
      <path d="M255,190 Q300,225 345,190"/>
    </g>
    <text x="300" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Dynamic compaction</text>
    <text x="300" y="364" text-anchor="middle" font-size="10.5" fill="#666">heavy tamper</text>
  </g>

  <!-- panel 3: jet grouting -->
  <g>
    <rect x="400" y="90" width="170" height="250" fill="#efe6cf"/>
    <line x1="400" y1="90" x2="570" y2="90" stroke="#8a7f5f" stroke-width="2"/>
    <g fill="#cfd6dd" stroke="#9aa4b0">
      <rect x="430" y="120" width="30" height="220"/>
      <rect x="500" y="120" width="30" height="220"/>
    </g>
    <line x1="445" y1="90" x2="445" y2="130" stroke="#333" stroke-width="4"/>
    <text x="485" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Jet grouting</text>
    <text x="485" y="364" text-anchor="middle" font-size="10.5" fill="#666">soil–cement columns</text>
  </g>

  <!-- panel 4: PVD drains -->
  <g>
    <rect x="585" y="90" width="170" height="250" fill="#e3d3a6"/>
    <line x1="585" y1="90" x2="755" y2="90" stroke="#8a7f5f" stroke-width="2"/>
    <g stroke="#c53030" stroke-width="3">
      <line x1="625" y1="100" x2="625" y2="330"/>
      <line x1="670" y1="100" x2="670" y2="330"/>
      <line x1="715" y1="100" x2="715" y2="330"/>
    </g>
    <rect x="585" y="90" width="170" height="14" fill="#b9a878"/>
    <text x="670" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Vertical drains</text>
    <text x="670" y="364" text-anchor="middle" font-size="10.5" fill="#666">accelerate consolidation</text>
  </g>

  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#999">Schematic after FHWA ground-improvement guidance. Not to scale.</text>
</svg>
