<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Địa kỹ thuật tổng hợp — một họ vật liệu, sáu chức năng riêng biệt</text>

  <!-- six panels -->
  <!-- 1 separation -->
  <g>
    <rect x="40" y="60" width="220" height="118" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="150" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Phân cách</text>
    <rect x="60" y="94" width="180" height="24" fill="#78716c"/>
    <line x1="60" y1="122" x2="240" y2="122" stroke="#1d4ed8" stroke-width="3.5"/>
    <rect x="60" y="126" width="180" height="24" fill="#e8e0cf"/>
    <text x="150" y="168" text-anchor="middle" font-size="9.5" fill="#475569">giữ cốt liệu không lẫn vào nền</text>
  </g>

  <!-- 2 reinforcement -->
  <g>
    <rect x="280" y="60" width="220" height="118" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="390" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Gia cố</text>
    <rect x="300" y="94" width="180" height="56" fill="#e8e0cf"/>
    <g stroke="#b45309" stroke-width="3">
      <line x1="304" y1="108" x2="476" y2="108"/>
      <line x1="304" y1="124" x2="476" y2="124"/>
      <line x1="304" y1="140" x2="476" y2="140"/>
    </g>
    <text x="390" y="168" text-anchor="middle" font-size="9.5" fill="#475569">chịu lực kéo mà đất không chịu được</text>
  </g>

  <!-- 3 filtration -->
  <g>
    <rect x="520" y="60" width="220" height="118" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="630" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Lọc</text>
    <rect x="540" y="94" width="180" height="30" fill="#e8e0cf"/>
    <line x1="540" y1="126" x2="720" y2="126" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/>
    <rect x="540" y="128" width="180" height="22" fill="#cbd5e1"/>
    <text x="630" y="168" text-anchor="middle" font-size="9.5" fill="#475569">nước qua được, đất bị giữ lại</text>
  </g>

  <!-- 4 drainage -->
  <g>
    <rect x="40" y="192" width="220" height="118" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="150" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Thoát nước</text>
    <rect x="60" y="226" width="180" height="60" fill="#e8e0cf"/>
    <path d="M100 234 L120 234 L120 280 L100 280" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M114 272 L120 284 L126 272" fill="#2563eb"/>
    <text x="150" y="300" text-anchor="middle" font-size="9.5" fill="#475569">dòng chảy trong mặt phẳng</text>
  </g>

  <!-- 5 containment -->
  <g>
    <rect x="280" y="192" width="220" height="118" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="390" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Chống thấm</text>
    <rect x="300" y="226" width="180" height="20" fill="#e8e0cf"/>
    <line x1="300" y1="250" x2="480" y2="250" stroke="#7c3aed" stroke-width="3.5"/>
    <rect x="300" y="254" width="180" height="32" fill="#dbeafe"/>
    <text x="390" y="300" text-anchor="middle" font-size="9.5" fill="#475569">màng địa kỹ thuật chặn dòng hoàn toàn</text>
  </g>

  <!-- 6 erosion control -->
  <g>
    <rect x="520" y="192" width="220" height="118" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="630" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Chống xói</text>
    <path d="M540 286 L600 226 L720 226 L720 286 Z" fill="#e8e0cf" stroke="#a8a29e"/>
    <g stroke="#0f766e" stroke-width="2">
      <line x1="560" y1="276" x2="620" y2="234"/>
      <line x1="585" y1="276" x2="645" y2="234"/>
      <line x1="610" y1="276" x2="670" y2="234"/>
      <line x1="635" y1="276" x2="695" y2="234"/>
    </g>
    <text x="630" y="300" text-anchor="middle" font-size="9.5" fill="#475569">giữ bề mặt chống dòng chảy</text>
  </g>

  <!-- G-rating table -->
  <text x="40" y="340" font-size="12" font-weight="700" fill="#334155">Phân loại G — độ bền vững chống hư hại khi thi công</text>
  <g>
    <rect x="40" y="350" width="140" height="26" fill="#fee2e2"/>
    <rect x="180" y="350" width="140" height="26" fill="#ffedd5"/>
    <rect x="320" y="350" width="140" height="26" fill="#fef9c3"/>
    <rect x="460" y="350" width="140" height="26" fill="#dcfce7"/>
    <rect x="600" y="350" width="140" height="26" fill="#d1fae5"/>
  </g>
  <g font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">
    <text x="110" y="367">G1 — khắc nghiệt nhất</text>
    <text x="250" y="367">G2</text>
    <text x="390" y="367">G3</text>
    <text x="530" y="367">G4</text>
    <text x="670" y="367">G5 — nhẹ nhất</text>
  </g>
  <g font-size="9.5" fill="#475569" text-anchor="middle">
    <text x="110" y="390">đá sắc, thiết bị nặng</text>
    <text x="250" y="390">trung bình</text>
    <text x="390" y="390">trung bình</text>
    <text x="530" y="390">nhẹ</text>
    <text x="670" y="390">đất mịn, thiết bị nhẹ</text>
  </g>

  <text x="40" y="424" font-size="10.5" fill="#475569">Chồng mí là bắt buộc: tối thiểu 300–600 mm, và chồng mí kém làm mất hoàn toàn chức năng gia cố.</text>
  <text x="40" y="440" font-size="10.5" fill="#b91c1c" font-weight="600">Gia cố có thể giảm chiều dày mặt đường 20–40 % — nhưng chỉ khi chức năng được chỉ định đúng.</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look (2007), Ch. 16 — địa kỹ thuật tổng hợp. Sơ đồ gốc.</text>
</svg>
