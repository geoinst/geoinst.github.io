<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Two ways to score a rock mass — RMR and the Q system</text>

  <!-- RMR -->
  <text x="215" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">RMR — Bieniawski (sum of points)</text>
  <rect x="40" y="70" width="350" height="30" fill="#1d4ed8"/>
  <text x="215" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">RMR = 5 parameters − orientation adjustment</text>

  <rect x="40" y="106" width="350" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="10.5" fill="#475569">
    <text x="54" y="128">Intact rock strength</text><text x="376" y="128" text-anchor="end">0 – 15</text>
    <text x="54" y="148">RQD</text><text x="376" y="148" text-anchor="end">0 – 20</text>
    <text x="54" y="168">Discontinuity spacing</text><text x="376" y="168" text-anchor="end">0 – 20</text>
    <text x="54" y="188">Discontinuity condition</text><text x="376" y="188" text-anchor="end">0 – 30</text>
    <text x="54" y="208">Groundwater</text><text x="376" y="208" text-anchor="end">0 – 15</text>
    <text x="54" y="230" font-weight="700" fill="#b91c1c">Orientation adjustment</text><text x="376" y="230" text-anchor="end" font-weight="700" fill="#b91c1c">−12 … 0</text>
  </g>
  <line x1="54" y1="240" x2="376" y2="240" stroke="#e2e8f0"/>

  <text x="215" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Total 0 – 100</text>

  <!-- RMR classes -->
  <g>
    <rect x="40" y="272" width="70" height="26" fill="#dc2626"/>
    <rect x="110" y="272" width="70" height="26" fill="#f97316"/>
    <rect x="180" y="272" width="70" height="26" fill="#eab308"/>
    <rect x="250" y="272" width="70" height="26" fill="#65a30d"/>
    <rect x="320" y="272" width="70" height="26" fill="#15803d"/>
  </g>
  <g font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="75" y="289">&lt; 21</text><text x="145" y="289">21–40</text><text x="215" y="289">41–60</text>
    <text x="285" y="289">61–80</text><text x="355" y="289">81–100</text>
  </g>
  <g font-size="9.5" fill="#475569" text-anchor="middle">
    <text x="75" y="314">very poor</text><text x="145" y="314">poor</text><text x="215" y="314">fair</text>
    <text x="285" y="314">good</text><text x="355" y="314">very good</text>
  </g>
  <text x="40" y="338" font-size="10.5" fill="#475569">Class I–V set the tunnel support and the</text>
  <text x="40" y="354" font-size="10.5" fill="#475569">maximum unsupported span.</text>

  <!-- Q -->
  <text x="580" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Q — Barton (product of ratios)</text>
  <rect x="405" y="70" width="350" height="30" fill="#0f766e"/>
  <text x="580" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Q = (RQD / Jn) × (Jr / Ja) × (Jw / SRF)</text>

  <g>
    <rect x="405" y="106" width="112" height="88" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="461" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Block size</text>
    <text x="461" y="152" text-anchor="middle" font-size="11" fill="#115e59">RQD / Jn</text>
    <text x="461" y="174" text-anchor="middle" font-size="9.5" fill="#475569">how big are</text>
    <text x="461" y="188" text-anchor="middle" font-size="9.5" fill="#475569">the blocks?</text>

    <rect x="524" y="106" width="112" height="88" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="580" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Friction</text>
    <text x="580" y="152" text-anchor="middle" font-size="11" fill="#115e59">Jr / Ja</text>
    <text x="580" y="174" text-anchor="middle" font-size="9.5" fill="#475569">how rough, how</text>
    <text x="580" y="188" text-anchor="middle" font-size="9.5" fill="#475569">filled?</text>

    <rect x="643" y="106" width="112" height="88" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="699" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Stress</text>
    <text x="699" y="152" text-anchor="middle" font-size="11" fill="#115e59">Jw / SRF</text>
    <text x="699" y="174" text-anchor="middle" font-size="9.5" fill="#475569">water and</text>
    <text x="699" y="188" text-anchor="middle" font-size="9.5" fill="#475569">squeezing?</text>
  </g>

  <!-- Q classes -->
  <rect x="405" y="206" width="350" height="50" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="419" y="226" font-size="10.5" fill="#115e59">Q 0.001–0.01 exceptionally poor · 0.1–1 very poor ·</text>
  <text x="419" y="244" font-size="10.5" fill="#115e59">1–10 fair · 10–40 good · 40–100 very good · &gt; 100 extremely good</text>

  <!-- what Q predicts -->
  <rect x="405" y="272" width="350" height="102" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="419" y="292" font-size="11" font-weight="700" fill="#334155">Q also predicts</text>
  <g font-size="10.5" fill="#475569">
    <text x="419" y="312">• support pressure and unsupported span</text>
    <text x="419" y="330">• rock-mass c and φ, and deformation</text>
    <text x="419" y="348">• P-wave velocity, Lugeon, advance rate</text>
    <text x="419" y="366">• relative tunnelling cost</text>
  </g>

  <rect x="40" y="382" width="715" height="52" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="54" y="404" font-size="11" fill="#9a3412">Use both systems. They disagree because they weight different things — the disagreement is the useful part.</text>
  <text x="54" y="422" font-size="11" fill="#9a3412">Either way, the output is a rock-mass strength and modulus far below the intact values (§9.8).</text>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look (2007), Ch. 18 — rock mass classification systems. Original diagram.</text>
</svg>
