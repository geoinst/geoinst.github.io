<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Từ SPT N₆₀ đến cường độ — hai họ hệ thức tương quan</text>

  <!-- LEFT: granular -->
  <text x="195" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Đất hạt rời — góc ma sát</text>

  <g>
    <rect x="60" y="80" width="270" height="26" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="60" y="106" width="270" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="60" y="132" width="270" height="26" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="60" y="158" width="270" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="60" y="184" width="270" height="26" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="60" y="210" width="270" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <g font-size="10.5" fill="#334155">
    <text x="70" y="97">Rất rời</text><text x="200" y="97">≤ 3</text><text x="250" y="97">φ &lt; 28°</text>
    <text x="70" y="123">Rời</text><text x="200" y="123">3 – 8</text><text x="250" y="123">28 – 30°</text>
    <text x="70" y="149">Chặt vừa</text><text x="200" y="149">8 – 25</text><text x="250" y="149">30 – 40°</text>
    <text x="70" y="175">Chặt</text><text x="200" y="175">25 – 42</text><text x="250" y="175">40 – 45°</text>
    <text x="70" y="201">Rất chặt</text><text x="200" y="201">&gt; 42</text><text x="250" y="201">45 – 50°</text>
    <text x="70" y="227" font-style="italic">Giới hạn (Dr = 100%)</text><text x="200" y="227">60</text><text x="250" y="227">50°</text>
  </g>
  <g font-size="10" fill="#64748b" font-weight="700">
    <text x="200" y="74">(N₁)₆₀</text><text x="250" y="74">φ</text>
  </g>

  <rect x="60" y="246" width="270" height="66" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="70" y="266" font-size="10.5" fill="#9a3412">φcrit = 30 + A + B  (A: góc cạnh, B: cấp phối)</text>
  <text x="70" y="284" font-size="10.5" fill="#9a3412">φđỉnh = 30 + A + B + C  (C: độ chặt, 0→9)</text>
  <text x="70" y="302" font-size="10.5" fill="#9a3412">Trừ 5° nếu lẫn sét; cộng 5° nếu lẫn sỏi.</text>

  <!-- RIGHT: cohesive -->
  <text x="585" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Đất dính — cường độ không thoát nước</text>

  <g>
    <rect x="450" y="80" width="270" height="26" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="450" y="106" width="270" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="450" y="132" width="270" height="26" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="450" y="158" width="270" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="450" y="184" width="270" height="26" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="450" y="210" width="270" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <g font-size="10.5" fill="#334155">
    <text x="460" y="97">Rất mềm</text><text x="590" y="97">≤ 2</text><text x="650" y="97">0 – 12 kPa</text>
    <text x="460" y="123">Mềm</text><text x="590" y="123">2 – 5</text><text x="650" y="123">12 – 25 kPa</text>
    <text x="460" y="149">Dẻo cứng</text><text x="590" y="149">5 – 10</text><text x="650" y="149">25 – 50 kPa</text>
    <text x="460" y="175">Cứng</text><text x="590" y="175">10 – 20</text><text x="650" y="175">50 – 100 kPa</text>
    <text x="460" y="201">Rất cứng</text><text x="590" y="201">20 – 40</text><text x="650" y="201">100 – 200 kPa</text>
    <text x="460" y="227">Rắn</text><text x="590" y="227">&gt; 40</text><text x="650" y="227">&gt; 200 kPa</text>
  </g>
  <g font-size="10" fill="#64748b" font-weight="700">
    <text x="590" y="74">N</text><text x="650" y="74">Cu</text>
  </g>

  <rect x="450" y="246" width="270" height="66" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="460" y="266" font-size="10.5" fill="#155e75">Ước lượng đầu tiên: Cu ≈ 5 N (kPa)</text>
  <text x="460" y="284" font-size="10.5" fill="#155e75">Dải thực tế: 2 N đến 8 N — phải bao dải.</text>
  <text x="460" y="302" font-size="10.5" fill="#155e75">Penetrometer cầm tay: qu ≈ 2 Cu.</text>

  <!-- bridge -->
  <rect x="60" y="330" width="660" height="72" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="352" font-size="11.5" font-weight="700" fill="#334155">Quy tắc của tác giả, khi áp dụng</text>
  <text x="76" y="372" font-size="10.5" fill="#475569">Mỗi hệ thức tương quan là một dải, không phải một đường. Dùng nó để bao dải giá trị thiết kế, rồi kiểm chứng với tài liệu được viện dẫn trước khi tin dùng.</text>
  <text x="76" y="390" font-size="10.5" fill="#b91c1c">Các hiệu chỉnh quan trọng hơn chính hệ thức: N chưa hiệu chỉnh có thể sai lệch gấp đôi.</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look (2007), Ch. 5 — cường độ đất từ phân loại và thử nghiệm. Sơ đồ gốc.</text>
</svg>
