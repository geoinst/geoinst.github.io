<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Instrumented embankment dam — typical layout</text>

  <!-- foundation -->
  <rect x="20" y="320" width="740" height="40" fill="#b8b0a2"/>
  <!-- reservoir -->
  <polygon points="20,190 285,190 190,320 20,320" fill="#9ec9ec"/>
  <!-- embankment -->
  <polygon points="190,320 330,120 450,120 650,320" fill="#c79a5b"/>
  <!-- core -->
  <polygon points="360,120 410,120 500,320 300,320" fill="#8a7f5f"/>
  <!-- toe drain -->
  <rect x="580" y="300" width="70" height="20" fill="#7a6a4f"/>

  <!-- survey monument on crest -->
  <polygon points="382,120 398,120 390,100" fill="#333"/>
  <line x1="390" y1="100" x2="390" y2="84" stroke="#333" stroke-width="2"/>

  <!-- piezometers in core -->
  <circle cx="360" cy="200" r="6" fill="#d9534f"/>
  <line x1="360" y1="200" x2="360" y2="120" stroke="#d9534f" stroke-width="2"/>
  <circle cx="400" cy="270" r="6" fill="#d9534f"/>
  <line x1="400" y1="270" x2="400" y2="120" stroke="#d9534f" stroke-width="2"/>

  <!-- extensometer upstream of core -->
  <line x1="300" y1="150" x2="300" y2="300" stroke="#5bc0de" stroke-width="2.5"/>
  <circle cx="300" cy="190" r="3.5" fill="#5bc0de"/><circle cx="300" cy="240" r="3.5" fill="#5bc0de"/>
  <rect x="292" y="140" width="16" height="10" fill="#5bc0de"/>

  <!-- inclinometer downstream shoulder -->
  <rect x="526" y="140" width="8" height="180" fill="#f0ad4e"/>
  <rect x="520" y="220" width="20" height="14" fill="#e08e2e"/>

  <!-- seepage weir at toe -->
  <rect x="646" y="306" width="22" height="14" fill="#2c7c4d"/>

  <!-- phreatic surface -->
  <polyline points="190,312 300,240 360,205 450,220 560,280 650,312" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="7 5" fill="none"/>

  <!-- labels -->
  <g font-size="12" fill="#222">
    <text x="390" y="76" text-anchor="middle">Survey monument</text>
    <text x="70" y="240" text-anchor="start" fill="#d9534f">Piezometers</text>
    <text x="70" y="180" text-anchor="start" fill="#5bc0de">Extensometer</text>
    <text x="710" y="180" text-anchor="end" fill="#e08e2e">Inclinometer</text>
    <text x="710" y="330" text-anchor="end" fill="#2c7c4d">Seepage weir</text>
    <text x="330" y="250" text-anchor="middle" fill="#2b6cb0">Phreatic surface</text>
    <text x="615" y="292" text-anchor="middle" fill="#444" font-size="11">Toe drain</text>
  </g>
  <text x="390" y="410" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from ASCE MOP-135 scope. Not to scale.</text>
</svg>
