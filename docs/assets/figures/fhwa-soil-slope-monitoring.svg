<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Instrumentation for an embankment on soft ground</text>

  <!-- soft clay foundation -->
  <rect x="30" y="270" width="720" height="120" fill="#e3d3a6"/>
  <text x="90" y="330" font-size="12" fill="#7a6a3a">Soft clay foundation</text>
  <!-- stiffer stratum -->
  <rect x="30" y="360" width="720" height="30" fill="#cbbd8f"/>
  <text x="90" y="381" font-size="11" fill="#6b5d33">Bearing stratum</text>

  <!-- embankment fill -->
  <polygon points="180,270 600,270 480,150 300,150" fill="#efe6cf" stroke="#b9a878" stroke-width="1.5"/>
  <text x="390" y="235" text-anchor="middle" font-size="12" fill="#6b5d33">Embankment fill</text>

  <!-- settlement platform -->
  <rect x="330" y="142" width="46" height="8" fill="#8a8a8a"/>
  <line x1="353" y1="142" x2="353" y2="112" stroke="#555" stroke-width="3"/>
  <rect x="344" y="104" width="18" height="10" fill="#f0ad4e" stroke="#b9791f"/>
  <text x="353" y="96" text-anchor="middle" font-size="11" fill="#333">Settlement platform</text>

  <!-- survey monument -->
  <polygon points="470,150 462,138 478,138" fill="#1565c0"/>
  <text x="512" y="132" text-anchor="middle" font-size="11" fill="#1565c0">Survey monument</text>

  <!-- inclinometer casing -->
  <rect x="238" y="150" width="9" height="220" fill="#f0ad4e"/>
  <polyline points="242,240 242,300 252,350 262,380" stroke="#b9791f" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <circle cx="242" cy="150" r="6" fill="#e08e2e"/>
  <text x="242" y="140" text-anchor="middle" font-size="11" fill="#a05a12">Inclinometer</text>

  <!-- piezometers in clay -->
  <g>
    <rect x="500" y="300" width="10" height="10" fill="#c53030"/>
    <rect x="497" y="288" width="16" height="14" fill="#e8c98a" stroke="#b9a878"/>
    <line x1="505" y1="300" x2="505" y2="286" stroke="#555" stroke-width="2"/>
    <rect x="500" y="340" width="10" height="10" fill="#c53030"/>
    <rect x="497" y="328" width="16" height="14" fill="#e8c98a" stroke="#b9a878"/>
    <line x1="505" y1="340" x2="505" y2="326" stroke="#555" stroke-width="2"/>
  </g>
  <text x="560" y="312" font-size="11" fill="#c53030">Piezometers</text>

  <!-- phreatic line -->
  <path d="M60,300 Q260,300 360,285 Q520,268 740,250" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="120" y="288" font-size="11" fill="#2b6cb0">Phreatic surface</text>

  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from FHWA-HI-98-034, Ch. 7. Not to scale.</text>
</svg>
