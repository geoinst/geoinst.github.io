<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Instrumentation for a rock slope</text>

  <!-- rock mass -->
  <polygon points="30,120 340,120 580,400 30,400" fill="#d9d2c5" stroke="#a89f8c" stroke-width="1.5"/>
  <text x="140" y="380" font-size="12" fill="#6b6350">Rock mass</text>

  <!-- discontinuities -->
  <g stroke="#a89f8c" stroke-width="1">
    <line x1="60" y1="120" x2="300" y2="400"/>
    <line x1="150" y1="120" x2="420" y2="400"/>
    <line x1="250" y1="120" x2="520" y2="400"/>
  </g>
  <!-- joint-bounded block near face -->
  <polygon points="360,168 430,168 505,270 435,270" fill="#c7bfae" stroke="#8f8672" stroke-width="1.5"/>
  <text x="452" y="230" font-size="11" fill="#6b6350" text-anchor="middle">Block</text>

  <!-- anchor with load cell -->
  <line x1="420" y1="215" x2="230" y2="185" stroke="#333" stroke-width="4"/>
  <rect x="352" y="196" width="20" height="16" fill="#f0ad4e" stroke="#b9791f" transform="rotate(-8 362 204)"/>
  <text x="250" y="172" font-size="11" fill="#333">Anchor + load cell</text>

  <!-- extensometer across a crack -->
  <rect x="150" y="112" width="46" height="10" fill="#2b6cb0"/>
  <line x1="196" y1="117" x2="250" y2="117" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="250" y1="100" x2="250" y2="140" stroke="#c53030" stroke-width="2"/>
  <text x="150" y="98" text-anchor="middle" font-size="11" fill="#2b6cb0">Extensometer</text>
  <text x="262" y="112" font-size="10" fill="#c53030">joint</text>

  <!-- piezometer -->
  <rect x="96" y="180" width="10" height="10" fill="#c53030"/>
  <rect x="93" y="168" width="16" height="14" fill="#e8c98a" stroke="#b9a878"/>
  <line x1="101" y1="180" x2="101" y2="166" stroke="#555" stroke-width="2"/>
  <text x="120" y="205" font-size="11" fill="#c53030">Piezometer (joint water pressure)</text>

  <!-- survey monument -->
  <polygon points="300,120 292,108 308,108" fill="#1565c0"/>
  <text x="300" y="100" text-anchor="middle" font-size="11" fill="#1565c0">Survey</text>

  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from FHWA-HI-98-034, Ch. 11. Not to scale.</text>
</svg>
