<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Multi-point borehole extensometer (MPBX)</text>

  <!-- borehole + grout -->
  <rect x="300" y="70" width="60" height="300" fill="#d8c08a"/>
  <!-- reference head at surface -->
  <rect x="280" y="60" width="100" height="14" fill="#555"/>
  <text x="470" y="72" font-size="12" fill="#222">Reference head (datum)</text>
  <line x1="380" y1="67" x2="465" y2="67" stroke="#999" stroke-width="1"/>

  <!-- rods from head to anchors -->
  <g stroke="#5bc0de" stroke-width="2.5">
    <line x1="320" y1="74" x2="320" y2="140"/>
    <line x1="335" y1="74" x2="335" y2="210"/>
    <line x1="350" y1="74" x2="350" y2="280"/>
    <line x1="365" y1="74" x2="365" y2="350"/>
  </g>
  <!-- anchors -->
  <g fill="#2b6cb0">
    <rect x="306" y="138" width="28" height="8"/>
    <rect x="321" y="208" width="28" height="8"/>
    <rect x="336" y="278" width="28" height="8"/>
    <rect x="351" y="348" width="28" height="8"/>
  </g>
  <g font-size="12" fill="#222">
    <text x="360" y="145">Anchor 1</text>
    <text x="375" y="215">Anchor 2</text>
    <text x="390" y="285">Anchor 3</text>
    <text x="405" y="355">Anchor 4 (deepest)</text>
  </g>

  <!-- movement readout -->
  <g stroke="#e53935" stroke-width="1.5" fill="#e53935">
    <line x1="620" y1="140" x2="620" y2="90"/>
    <polygon points="620,90 615,102 625,102"/>
    <line x1="620" y1="290" x2="620" y2="340"/>
    <polygon points="620,340 615,328 625,328"/>
  </g>
  <text x="690" y="200" text-anchor="middle" font-size="12" fill="#e53935">Relative movement</text>
  <text x="690" y="216" text-anchor="middle" font-size="12" fill="#e53935">between anchors</text>

  <!-- labels -->
  <g font-size="12" fill="#222">
    <text x="160" y="180" text-anchor="middle" fill="#2b6cb0">Grout / borehole</text>
    <text x="160" y="196" text-anchor="middle" fill="#5bc0de">Rods to surface</text>
  </g>
  <text x="390" y="388" text-anchor="middle" font-size="11" fill="#999">Schematic adapted from Dunnicliff, Ch. 12. Not to scale.</text>
</svg>
