<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Tailings storage facility — principal components</text>

  <!-- foundation -->
  <rect x="20" y="305" width="740" height="40" fill="#b8b0a2"/>
  <!-- pond (supernatant water) -->
  <polygon points="20,275 175,275 175,305 20,305" fill="#9ec9ec"/>
  <!-- tailings beach (sandy deposit) -->
  <polygon points="175,275 500,130 500,305 175,305" fill="#e8d9b0"/>
  <!-- embankment (brown) -->
  <polygon points="480,305 500,120 565,120 700,305" fill="#c79a5b"/>
  <!-- downstream toe / foundation drain -->
  <rect x="640" y="298" width="60" height="7" fill="#7a6a4f"/>
  <!-- phreatic surface (dashed) inside tailings -->
  <polyline points="175,285 500,150" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <!-- decant tower -->
  <rect x="108" y="110" width="14" height="195" fill="#555"/>
  <rect x="100" y="104" width="30" height="10" fill="#333"/>

  <!-- freeboard arrow -->
  <line x1="520" y1="275" x2="520" y2="120" stroke="#e53935" stroke-width="1.5"/>
  <polygon points="520,120 515,132 525,132" fill="#e53935"/>
  <polygon points="520,275 515,263 525,263" fill="#e53935"/>

  <!-- labels -->
  <g font-size="12" fill="#222">
    <text x="600" y="200" text-anchor="middle">Embankment (dam)</text>
    <text x="330" y="250" text-anchor="middle">Tailings beach</text>
    <text x="95" y="250" text-anchor="middle">Supernatant</text>
    <text x="95" y="266" text-anchor="middle">pond</text>
    <text x="115" y="95" text-anchor="middle">Decant</text>
    <text x="115" y="80" text-anchor="middle">tower</text>
    <text x="430" y="175" fill="#2b6cb0">Phreatic surface</text>
    <text x="540" y="210" fill="#e53935">Freeboard</text>
    <text x="390" y="358" text-anchor="middle" fill="#5d564a">Foundation / foundation drain</text>
  </g>
  <text x="390" y="372" text-anchor="middle" font-size="11" fill="#666">Schematic adapted from ICOLD Bulletin 194. Not to scale.</text>
</svg>
