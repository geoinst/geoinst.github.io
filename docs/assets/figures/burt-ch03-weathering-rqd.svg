<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Weathering profile and the rock quality designation (RQD)</text>

  <!-- LEFT: weathering profile -->
  <text x="150" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Weathering grades (top → down)</text>
  <g>
    <rect x="40" y="70" width="220" height="52" fill="#b58a5a"/>
    <rect x="40" y="122" width="220" height="52" fill="#c39a6b"/>
    <rect x="40" y="174" width="220" height="52" fill="#cdb18a"/>
    <rect x="40" y="226" width="220" height="52" fill="#d9c6ab"/>
    <rect x="40" y="278" width="220" height="52" fill="#e6dcc9"/>
    <rect x="40" y="330" width="220" height="52" fill="#f2eee6"/>
  </g>
  <g font-size="11" fill="#3f2f1a">
    <text x="52" y="92" font-weight="700">VI — residual soil</text>
    <text x="52" y="108">soil, original fabric destroyed</text>
    <text x="52" y="144" font-weight="700">V — extremely weathered</text>
    <text x="52" y="160">discoloured, core crumbles</text>
    <text x="52" y="196" font-weight="700">IV — highly weathered</text>
    <text x="52" y="212">weak, breaks by hand</text>
    <text x="52" y="248" font-weight="700">III — moderately weathered</text>
    <text x="52" y="264">stained, breaks with hammer</text>
    <text x="52" y="300" font-weight="700">II — slightly weathered</text>
    <text x="52" y="316">discolouration on joints only</text>
    <text x="52" y="352" font-weight="700">I — fresh rock</text>
    <text x="52" y="368">unweathered, intact</text>
  </g>

  <!-- RIGHT: RQD core run -->
  <text x="560" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">RQD = Σ (intact pieces ≥ 100 mm) ÷ total run</text>

  <!-- core barrel outline -->
  <rect x="300" y="80" width="520" height="46" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="316" y="72" font-size="10.5" fill="#475569">Core run = 1.0 m</text>

  <!-- intact core pieces with fractures -->
  <g>
    <!-- piece lengths in px, total 520 -->
    <rect x="302" y="82" width="120" height="42" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="426" y="82" width="34" height="42" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="464" y="82" width="140" height="42" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="608" y="82" width="22" height="42" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="634" y="82" width="184" height="42" fill="#cbd5e1" stroke="#64748b"/>
  </g>
  <g font-size="9.5" fill="#334155" text-anchor="middle">
    <text x="362" y="108">200 mm</text>
    <text x="443" y="108">60 mm</text>
    <text x="534" y="108">230 mm</text>
    <text x="619" y="108">40 mm</text>
    <text x="726" y="108">310 mm</text>
  </g>

  <!-- tally -->
  <rect x="300" y="150" width="520" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="316" y="172" font-size="12" font-weight="700" fill="#334155">Counting rule</text>
  <text x="316" y="194" font-size="11" fill="#475569">Pieces ≥ 100 mm count in full: 200 + 230 + 310 = 740 mm</text>
  <text x="316" y="214" font-size="11" fill="#475569">Pieces &lt; 100 mm are discarded: 60 and 40 mm</text>
  <text x="316" y="240" font-size="12" font-weight="700" fill="#0f766e">RQD = 740 / 1000 = 74 %</text>
  <line x1="316" y1="252" x2="804" y2="252" stroke="#e2e8f0"/>
  <text x="316" y="272" font-size="11" fill="#475569">Discontinuities must be natural — drilling breaks are ignored.</text>
  <text x="316" y="290" font-size="11" fill="#475569">Measured along the core axis; RQD is directional.</text>

  <!-- RQD scale -->
  <text x="300" y="330" font-size="11.5" font-weight="700" fill="#334155">RQD quality bands</text>
  <g>
    <rect x="300" y="340" width="104" height="26" fill="#dc2626"/>
    <rect x="404" y="340" width="104" height="26" fill="#f97316"/>
    <rect x="508" y="340" width="104" height="26" fill="#eab308"/>
    <rect x="612" y="340" width="104" height="26" fill="#65a30d"/>
    <rect x="716" y="340" width="104" height="26" fill="#15803d"/>
  </g>
  <g font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="352" y="357">0–25</text><text x="456" y="357">25–50</text><text x="560" y="357">50–75</text>
    <text x="664" y="357">75–90</text><text x="768" y="357">90–100</text>
  </g>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="352" y="382">very poor</text><text x="456" y="382">poor</text><text x="560" y="382">fair</text>
    <text x="664" y="382">good</text><text x="768" y="382">excellent</text>
  </g>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look (2007), Ch. 3 — weathering grades, RQD and discontinuity spacing. Original diagram.</text>
</svg>
