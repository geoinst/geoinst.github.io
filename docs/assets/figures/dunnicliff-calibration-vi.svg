<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="360" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Hiệu chuẩn, điểm không, khoảng đo và trễ</text>

  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="300" x2="700" y2="300" stroke="#333" stroke-width="2"/>
  <text x="395" y="338" text-anchor="middle" font-size="12" fill="#222">Đầu vào tác dụng (tải / áp lực / chuyển vị)</text>
  <text x="34" y="190" text-anchor="middle" font-size="12" fill="#222" transform="rotate(-90 34 190)">Số đọc thiết bị (đầu ra)</text>

  <!-- calibration line -->
  <line x1="90" y1="300" x2="660" y2="100" stroke="#1565c0" stroke-width="3"/>
  <!-- hysteresis loop (loading vs unloading) -->
  <path d="M90,300 L400,190 L660,100 L400,220 Z" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- zero marker -->
  <circle cx="90" cy="300" r="5" fill="#2e7d32"/>
  <text x="150" y="292" font-size="12" fill="#2e7d32">Điểm không</text>
  <!-- span marker -->
  <line x1="660" y1="100" x2="660" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="600" y="320" text-anchor="middle" font-size="12" fill="#666">Khoảng đo (toàn dải)</text>
  <!-- slope annotation -->
  <text x="470" y="150" font-size="12" fill="#1565c0">Hệ số hiệu chuẩn = độ dốc</text>
  <text x="470" y="240" font-size="12" fill="#e53935">Vòng trễ (tăng so với giảm tải)</text>

  <text x="390" y="356" text-anchor="middle" font-size="11" fill="#999">Một số đọc đáng tin cần quan hệ vào–ra đã biết, được kiểm chứng tại hiện trường. Phỏng theo Dunnicliff, Ch. 7 và 16.</text>
</svg>
