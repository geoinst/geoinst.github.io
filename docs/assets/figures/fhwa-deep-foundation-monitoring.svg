<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Load-transfer instrumentation for a deep foundation</text>

  <!-- soil -->
  <rect x="30" y="120" width="720" height="270" fill="#efe6cf"/>
  <line x1="30" y1="120" x2="750" y2="120" stroke="#8a7f5f" stroke-width="2"/>
  <text x="70" y="146" font-size="12" fill="#7a6a3a">Ground surface</text>

  <!-- pile -->
  <rect x="345" y="96" width="70" height="270" fill="#dfe4ea" stroke="#9aa4b0" stroke-width="1.5"/>
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#4a5568" transform="rotate(-90 380 240)">Pile / shaft</text>

  <!-- load cell at head -->
  <rect x="345" y="66" width="70" height="30" rx="3" fill="#f0ad4e" stroke="#b9791f" stroke-width="1.5"/>
  <text x="380" y="86" text-anchor="middle" font-size="11" fill="#5a3d0a">Load cell</text>
  <!-- applied load arrow -->
  <line x1="380" y1="20" x2="380" y2="60" stroke="#333" stroke-width="3"/>
  <polygon points="380,62 373,50 387,50" fill="#333"/>
  <text x="430" y="40" font-size="11" fill="#333">Applied axial load</text>

  <!-- sister bars / strain gages -->
  <g fill="#c53030">
    <rect x="356" y="150" width="12" height="12"/>
    <rect x="356" y="205" width="12" height="12"/>
    <rect x="356" y="260" width="12" height="12"/>
    <rect x="356" y="315" width="12" height="12"/>
  </g>
  <text x="470" y="160" font-size="11" fill="#c53030">Sister bars / strain gages</text>

  <!-- telltales -->
  <g stroke="#2b6cb0" stroke-width="2" stroke-dasharray="5 4">
    <line x1="400" y1="360" x2="400" y2="60"/>
    <line x1="412" y1="320" x2="412" y2="60"/>
    <line x1="424" y1="280" x2="424" y2="60"/>
  </g>
  <text x="470" y="300" font-size="11" fill="#2b6cb0">Telltales (interval movement)</text>

  <!-- pressure cell at toe -->
  <rect x="348" y="358" width="64" height="14" rx="2" fill="#2f855a" stroke="#1e5c3a" stroke-width="1.5"/>
  <text x="470" y="370" font-size="11" fill="#1e5c3a">Pressure cell at toe</text>

  <!-- strain -> load note -->
  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#666">Measured strain converts to load via the elastic modulus: P = E·A·ε</text>
</svg>
