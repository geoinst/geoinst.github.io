<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">The three components of foundation settlement</text>

  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="70" x2="730" y2="70" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="220" font-size="12" fill="#333" transform="rotate(-90 60 220)" text-anchor="middle">Settlement</text>
  <text x="410" y="392" font-size="12" fill="#333" text-anchor="middle">Time</text>

  <!-- immediate settlement: steep drop -->
  <polyline points="90,70 150,120 200,175" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <!-- primary consolidation -->
  <polyline points="200,175 280,215 380,250 500,275" fill="none" stroke="#2f855a" stroke-width="3"/>
  <!-- secondary -->
  <polyline points="500,275 620,300 730,325" fill="none" stroke="#c07a1f" stroke-width="3"/>

  <!-- stage dividers -->
  <line x1="200" y1="70" x2="200" y2="360" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="70" x2="500" y2="360" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- labels -->
  <text x="140" y="100" text-anchor="middle" font-size="11" fill="#2b6cb0">Immediate</text>
  <text x="140" y="114" text-anchor="middle" font-size="10" fill="#2b6cb0">(elastic)</text>
  <text x="340" y="205" text-anchor="middle" font-size="11" fill="#2f855a">Primary consolidation</text>
  <text x="340" y="219" text-anchor="middle" font-size="10" fill="#2f855a">(drainage, months–years)</text>
  <text x="620" y="300" text-anchor="middle" font-size="11" fill="#8a5510">Secondary (creep)</text>

  <text x="390" y="414" text-anchor="middle" font-size="11" fill="#999">Schematic after USACE EM 1110-1-1904. Not to scale.</text>
</svg>
