<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Thí nghiệm xuyên tiêu chuẩn và đường từ N đến N₆₀</text>

  <!-- LEFT: SPT setup -->
  <text x="185" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Sơ đồ thí nghiệm</text>

  <rect x="150" y="72" width="70" height="34" fill="#64748b" stroke="#475569"/>
  <text x="185" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">63.5 kg</text>
  <line x1="185" y1="106" x2="185" y2="128" stroke="#334155" stroke-width="3"/>
  <text x="196" y="122" font-size="10" fill="#475569">rơi 760 mm</text>

  <line x1="185" y1="128" x2="185" y2="300" stroke="#94a3b8" stroke-width="5"/>

  <line x1="130" y1="128" x2="130" y2="400" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="128" x2="240" y2="400" stroke="#334155" stroke-width="2"/>
  <rect x="130" y="300" width="110" height="100" fill="#e8e0cf" opacity="0.5"/>

  <rect x="172" y="300" width="26" height="70" fill="#a16207" stroke="#78350f"/>
  <text x="250" y="330" font-size="10.5" fill="#78350f">ống phẩy,</text>
  <text x="250" y="344" font-size="10.5" fill="#78350f">ĐK ngoài 45 mm</text>

  <text x="150" y="392" font-size="10.5" fill="#475569">đóng định vị 150 mm</text>
  <text x="150" y="408" font-size="10.5" fill="#475569">+ 300 mm thí nghiệm</text>
  <text x="185" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">N = số búa / 300 mm</text>

  <!-- RIGHT: correction chain -->
  <text x="560" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Chuỗi hiệu chỉnh</text>

  <rect x="330" y="72" width="180" height="44" fill="#1d4ed8"/>
  <text x="420" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">N hiện trường</text>
  <text x="420" y="108" text-anchor="middle" font-size="10" fill="#dbeafe">như ghi trong biên bản</text>

  <path d="M420 116 L420 138" stroke="#475569" stroke-width="2"/>
  <path d="M414 132 L420 140 L426 132" fill="#475569"/>

  <rect x="330" y="140" width="180" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="420" y="160" text-anchor="middle" font-size="11" fill="#334155">Tỷ số năng lượng  C<tspan baseline-shift="sub" font-size="8">E</tspan> = ER/60</text>

  <path d="M420 170 L420 188" stroke="#475569" stroke-width="2"/>
  <path d="M414 182 L420 190 L426 182" fill="#475569"/>

  <rect x="330" y="190" width="180" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="420" y="210" text-anchor="middle" font-size="11" fill="#334155">Đường kính hố khoan  C<tspan baseline-shift="sub" font-size="8">B</tspan></text>

  <path d="M420 220 L420 238" stroke="#475569" stroke-width="2"/>
  <path d="M414 232 L420 240 L426 232" fill="#475569"/>

  <rect x="330" y="240" width="180" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="420" y="260" text-anchor="middle" font-size="11" fill="#334155">Chiều dài cần  C<tspan baseline-shift="sub" font-size="8">R</tspan></text>

  <path d="M420 270 L420 288" stroke="#475569" stroke-width="2"/>
  <path d="M414 282 L420 290 L426 282" fill="#475569"/>

  <rect x="330" y="290" width="180" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="420" y="310" text-anchor="middle" font-size="11" fill="#334155">Loại ống mẫu  C<tspan baseline-shift="sub" font-size="8">S</tspan></text>

  <path d="M420 320 L420 338" stroke="#475569" stroke-width="2"/>
  <path d="M414 332 L420 340 L426 332" fill="#475569"/>

  <rect x="330" y="340" width="180" height="44" fill="#0f766e"/>
  <text x="420" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(N₁)₆₀</text>
  <text x="420" y="376" text-anchor="middle" font-size="10" fill="#ccfbf1">chuẩn hóa tải phủ, năng lượng 60%</text>

  <!-- formula panel -->
  <rect x="540" y="140" width="216" height="244" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="556" y="164" font-size="11.5" font-weight="700" fill="#334155">Các hiệu chỉnh</text>
  <text x="556" y="188" font-size="11" fill="#1d4ed8" font-weight="700">N₆₀ = N × C<tspan baseline-shift="sub" font-size="8">E</tspan> × C<tspan baseline-shift="sub" font-size="8">B</tspan> × C<tspan baseline-shift="sub" font-size="8">R</tspan> × C<tspan baseline-shift="sub" font-size="8">S</tspan></text>
  <text x="556" y="212" font-size="11" fill="#1d4ed8" font-weight="700">(N₁)₆₀ = N₆₀ × C<tspan baseline-shift="sub" font-size="8">N</tspan></text>
  <line x1="556" y1="224" x2="740" y2="224" stroke="#e2e8f0"/>
  <text x="556" y="246" font-size="10.5" fill="#475569">C<tspan baseline-shift="sub" font-size="8">E</tspan> — năng lượng búa (0,5–1,6)</text>
  <text x="556" y="264" font-size="10.5" fill="#475569">C<tspan baseline-shift="sub" font-size="8">B</tspan> — đường kính hố khoan (1,0–1,15)</text>
  <text x="556" y="282" font-size="10.5" fill="#475569">C<tspan baseline-shift="sub" font-size="8">R</tspan> — chiều dài cần (&lt;1 khi cần ngắn)</text>
  <text x="556" y="300" font-size="10.5" fill="#475569">C<tspan baseline-shift="sub" font-size="8">S</tspan> — loại ống mẫu (1,0–1,3)</text>
  <text x="556" y="318" font-size="10.5" fill="#475569">C<tspan baseline-shift="sub" font-size="8">N</tspan> — tải phủ (≤ 1,7)</text>
  <line x1="556" y1="330" x2="740" y2="330" stroke="#e2e8f0"/>
  <text x="556" y="352" font-size="10.5" fill="#b91c1c" font-weight="600">Không hiệu chỉnh tải phủ cho sét.</text>
  <text x="556" y="370" font-size="10.5" fill="#b91c1c" font-weight="600">Không bao giờ lấy Cu từ mẫu SPT.</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look (2007), Ch. 4 — SPT trong đất, hệ số hiệu chỉnh tải phủ và thiết bị. Sơ đồ gốc.</text>
</svg>
