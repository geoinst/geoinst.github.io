<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Nỗ lực khảo sát theo các giai đoạn dự án</text>

  <!-- phase columns -->
  <g>
    <rect x="40" y="56" width="168" height="150" fill="#eef4ff" stroke="#c7d7f5"/>
    <rect x="216" y="56" width="168" height="150" fill="#e6eefc" stroke="#b8cdf1"/>
    <rect x="392" y="56" width="168" height="150" fill="#dde8fa" stroke="#a7c1ec"/>
    <rect x="568" y="56" width="172" height="150" fill="#d3e1f8" stroke="#94b3e6"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <text x="124" y="80">Ý tưởng / tiền khả thi</text>
    <text x="300" y="80">Thiết kế sơ bộ</text>
    <text x="476" y="80">Thiết kế chi tiết</text>
    <text x="654" y="80">Thi công</text>
  </g>

  <g font-size="10.5" fill="#334155">
    <text x="52" y="102">Nghiên cứu tài liệu, bản đồ địa chất,</text>
    <text x="52" y="117">ảnh hàng không, khảo sát thị sát</text>
    <text x="52" y="132">Mô hình vùng; sàng lọc lỗi</text>
    <text x="52" y="147">nghiêm trọng của phương án</text>
    <text x="52" y="170" font-weight="700" fill="#1e3a8a">Chi phí thấp, đòn bẩy cao</text>

    <text x="228" y="102">Hố khoan mục tiêu và</text>
    <text x="228" y="117">thí nghiệm hiện trường</text>
    <text x="228" y="132">Mô hình nền; dải thông số</text>
    <text x="228" y="147">cho thiết kế sơ bộ</text>
    <text x="228" y="170" font-weight="700" fill="#1e3a8a">Xác nhận / bác bỏ giả thuyết</text>

    <text x="404" y="102">Mạng dày, thí nghiệm phòng,</text>
    <text x="404" y="117">giếng quan trắc</text>
    <text x="404" y="132">Thông số thiết kế,</text>
    <text x="404" y="147">lún và ổn định</text>
    <text x="404" y="170" font-weight="700" fill="#1e3a8a">Giảm rủi ro còn lại</text>

    <text x="580" y="102">Kiểm chứng, hồ sơ</text>
    <text x="580" y="117">hoàn công, quan trắc</text>
    <text x="580" y="132">hiệu năng</text>
    <text x="580" y="147">Xác nhận giả thuyết thiết kế</text>
    <text x="580" y="170" font-weight="700" fill="#1e3a8a">Phương pháp quan trắc</text>
  </g>

  <!-- rising effort staircase -->
  <text x="40" y="238" font-size="12" font-weight="700" fill="#444">Nỗ lực khảo sát (và chi phí)</text>
  <g>
    <rect x="40" y="300" width="168" height="34" fill="#93b4ee"/>
    <rect x="216" y="272" width="168" height="62" fill="#6f97e4"/>
    <rect x="392" y="240" width="168" height="94" fill="#4a79d6"/>
    <rect x="568" y="256" width="172" height="78" fill="#3563c0"/>
  </g>
  <line x1="30" y1="334" x2="756" y2="334" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="124" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5%</text>
  <text x="300" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">20%</text>
  <text x="476" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">55%</text>
  <text x="654" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">20%</text>

  <!-- note -->
  <rect x="40" y="352" width="700" height="76" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="54" y="374" font-size="12" font-weight="700" fill="#9a3412">Chi phí dồn vào giai đoạn đầu nhưng rất nhỏ so với công trình — trong khi các quyết định thiết kế mà nó cho phép thì không.</text>
  <text x="54" y="394" font-size="11" fill="#7c2d12">Một dị thường nhỏ vô hại với nền đắp lớn lại có thể quyết định với móng băng hẹp (ý nghĩa của tỷ lệ, §1.3).</text>
  <text x="54" y="412" font-size="11" fill="#7c2d12">Khoan là để xác nhận hoặc bác bỏ giả thuyết — không phải để "xem có gì" (§1.7).</text>

  <text x="30" y="452" font-size="10.5" fill="#777">Theo Burt G. Look, Cẩm nang Tra cứu &amp; Thiết kế Địa kỹ thuật (2007), Ch. 1. Sơ đồ gốc.</text>
</svg>
