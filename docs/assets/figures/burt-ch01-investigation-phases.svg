<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Inter, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Investigation effort across the project phases</text>

  <!-- phase columns -->
  <g>
    <rect x="40" y="56" width="168" height="150" fill="#eef4ff" stroke="#c7d7f5"/>
    <rect x="216" y="56" width="168" height="150" fill="#e6eefc" stroke="#b8cdf1"/>
    <rect x="392" y="56" width="168" height="150" fill="#dde8fa" stroke="#a7c1ec"/>
    <rect x="568" y="56" width="172" height="150" fill="#d3e1f8" stroke="#94b3e6"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <text x="124" y="80">Concept / feasibility</text>
    <text x="300" y="80">Preliminary design</text>
    <text x="476" y="80">Detailed design</text>
    <text x="654" y="80">Construction</text>
  </g>

  <g font-size="10.5" fill="#334155">
    <text x="52" y="102">Desk study, geology maps,</text>
    <text x="52" y="117">aerial photos, walk-over</text>
    <text x="52" y="132">Regional model; fatal-flaw</text>
    <text x="52" y="147">screening of options</text>
    <text x="52" y="170" font-weight="700" fill="#1e3a8a">Low cost, high leverage</text>

    <text x="228" y="102">Targeted boreholes and</text>
    <text x="228" y="117">in-situ tests</text>
    <text x="228" y="132">Ground model; parameter</text>
    <text x="228" y="147">ranges for outline design</text>
    <text x="228" y="170" font-weight="700" fill="#1e3a8a">Confirm / reject hypotheses</text>

    <text x="404" y="102">Dense grid, lab testing,</text>
    <text x="404" y="117">monitoring wells</text>
    <text x="404" y="132">Design parameters,</text>
    <text x="404" y="147">settlement and stability</text>
    <text x="404" y="170" font-weight="700" fill="#1e3a8a">Reduce residual risk</text>

    <text x="580" y="102">Verification, as-built</text>
    <text x="580" y="117">records, performance</text>
    <text x="580" y="132">monitoring</text>
    <text x="580" y="147">Confirm design assumptions</text>
    <text x="580" y="170" font-weight="700" fill="#1e3a8a">Observational method</text>
  </g>

  <!-- rising effort staircase -->
  <text x="40" y="238" font-size="12" font-weight="700" fill="#444">Investigation effort (and cost)</text>
  <g>
    <rect x="40" y="300" width="168" height="34" fill="#93b4ee"/>
    <rect x="216" y="272" width="168" height="62" fill="#6f97e4"/>
    <rect x="392" y="240" width="168" height="94" fill="#4a79d6"/>
    <rect x="568" y="256" width="172" height="78" fill="#3563c0"/>
  </g>
  <line x1="30" y1="334" x2="756" y2="334" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="124" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5%</text>
  <text x="300" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">20%</text>
  <text x="476" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">55%</text>
  <text x="654" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">20%</text>

  <!-- note -->
  <rect x="40" y="352" width="700" height="76" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="54" y="374" font-size="12" font-weight="700" fill="#9a3412">The cost is front-loaded but tiny relative to the project — while the design decisions it enables are not.</text>
  <text x="54" y="394" font-size="11" fill="#7c2d12">A small anomaly that is harmless for a large embankment can govern a narrow strip footing (relevance of scale, §1.3).</text>
  <text x="54" y="412" font-size="11" fill="#7c2d12">Drilling is to confirm or reject a hypothesis — never to "see what is there" (§1.7).</text>

  <text x="30" y="452" font-size="10.5" fill="#777">After Burt G. Look, Handbook of Geotechnical Investigation and Design Tables (2007), Ch. 1. Original diagram.</text>
</svg>
